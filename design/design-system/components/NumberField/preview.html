<!doctype html>
<html>
<head><meta charset="utf-8"><title>NumberField — preview</title></head>
<body>
<div id="root"></div>
<script>
var F = window.FitMeal, h = React.createElement;
function root(el){ ReactDOM.createRoot(document.getElementById('root')).render(el); }
root(h('div', {className:'fm-stack', style:{padding:16, maxWidth:360}},
  h(F.NumberField, {large:true, value:'1500', unit:'kcal/day', hint:'Suggested from your goal — change it anytime.'}),
  h('div', {className:'fm-row', style:{flexWrap:'nowrap'}},
    h(F.NumberField, {label:'Protein min.', value:'115', unit:'g'}),
    h(F.NumberField, {label:'Weekly budget', value:'80', unit:'PLN', error:'Too low for 7 days'}))));
</script>
</body>
</html>
