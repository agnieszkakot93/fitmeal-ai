<!-- @dsCard group="Screens" height=900 width=2610 page subtitle="Today, Recipe, the allergen notice with a rebalance proposal, No profile on this phone, an import fallback with the no-profile block, and Where your data lives in the dark theme" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Dark theme</title></head>
<body>
<div id="root"></div>
<script>
var F = window.FitMeal, h = React.createElement;
function root(el){ ReactDOM.createRoot(document.getElementById('root')).render(el); }
function Ph(caption, content, footer, theme){ return h(F.PhoneFrame, {caption:caption, footer:footer, theme:theme}, content); }
function show(list){ root(h.apply(null, ['div', {className:'fm-showcase'}].concat(list))); }
function scroll(){ return h.apply(null, ['div', {className:'fm-screen-scroll'}].concat([].slice.call(arguments))); }
function cta(label, extra, disabled){ return h('div', {className:'fm-sticky'}, extra || null, h(F.Button, {variant:'primary', size:'lg', block:true, disabled:!!disabled}, label)); }
function q(title, sub){ return h('div', {style:{display:'flex', flexDirection:'column', gap:8, paddingTop:8}}, h('h1', {className:'fm-hxl', style:{fontSize:30, lineHeight:'34px'}}, title), sub ? h('p', {className:'fm-callout'}, sub) : null); }
function card(){ return h.apply(null, ['div', {style:{background:'var(--surface-raised)', border:'1px solid var(--line)', borderRadius:'var(--radius-lg)', padding:16, display:'flex', flexDirection:'column', gap:12}}].concat([].slice.call(arguments))); }
function row(label, value, icon, danger){ return h('div', {style:{display:'flex', alignItems:'center', gap:12, padding:'12px 16px', borderBottom:'1px solid var(--line)', background:'var(--surface-raised)'}},
  icon ? h('span', {style:{color: danger ? 'var(--danger)' : 'var(--ink-muted)'}}, h(F.Icon, {name:icon, size:20})) : null,
  h('span', {style:{flex:1, font:'500 16px/22px var(--font-text)', color: danger ? 'var(--danger)' : 'var(--ink)'}}, label),
  value ? h('span', {style:{font:'500 15px/20px var(--font-text)', color:'var(--ink-muted)'}}, value) : null,
  h('span', {style:{color:'var(--ink-faint)'}}, h(F.Icon, {name:'chevron-right', size:18}))); }
function label(t){ return h('span', {className:'fm-cap'}, t); }
function sheet(){ return h('div', {key:'s', className:'fm-scrim'}, h.apply(null, ['div', {className:'fm-sheet'}, h('span', {className:'fm-sheet-grab'})].concat([].slice.call(arguments)))); }
function sheetHead(title){ return h('div', {style:{display:'flex', justifyContent:'space-between', alignItems:'center'}}, h('h2', {className:'fm-h2'}, title), h(F.IconButton, {icon:'close', label:'Close'})); }
var AV = h(F.Avatar, {initials:'OL', label:'Profile'});
var PREP = {portion:'1/2', cook:'Wed', eatBy:'Thu'};
var TODAY_MEALS = [
  h(F.MealCard, {key:1, slot:'Breakfast', time:'08:00', title:'Protein Snickers Shake', kcal:520, protein:44, carbs:52, fat:14, status:'eaten', badges:[{label:'Prepare fresh', icon:'clock'}]}),
  h(F.MealCard, {key:2, slot:'Lunch', time:'13:30', title:'Chicken Teriyaki', kcal:548, protein:49, carbs:58, fat:12, status:'cooked', prep:PREP}),
  h(F.MealCard, {key:3, slot:'Dinner', time:'19:00', title:'Turkey Pasta Bake', kcal:429, protein:32, carbs:40, fat:14, prep:PREP})
];
function daySummary(){ return card(
  h('div', {style:{display:'flex', alignItems:'center', gap:16}},
    h(F.MacroRing, {value:1497, target:1500, size:112, stroke:10, macros:{protein:{share:.32}, carbs:{share:.35}, fat:{share:.33}}}),
    h('div', {style:{flex:1, display:'flex', flexDirection:'column', gap:10}},
      h(F.MacroBar, {macro:'protein', value:125, target:115, mode:'min', compact:true}),
      h(F.MacroBar, {macro:'carbs', value:150, target:140, compact:true}),
      h(F.MacroBar, {macro:'fat', value:40, target:50, compact:true})))); }
var UP_NEXT = h(F.BottomAccessory, {icon:'clock', title:'Up next · Dinner 19:00', subtitle:'Turkey Pasta Bake · meal prep 1/2', action:'Eat'});
show([
 Ph('Today · dark', [
   h(F.NavBar, {key:'n', large:true, title:'Today', subtitle:'Wednesday, 24 September', avatar:AV}),
   scroll(daySummary(), h(F.SectionHeader, {title:'Meals', meta:'1 of 3 eaten'}), TODAY_MEALS),
   h(F.TabBar, {key:'t', active:'today', accessory:UP_NEXT})
 ], null, 'dark'),
 Ph('Recipe · dark', [
   h(F.RecipeHero, {key:'hero', className:'fm-hero-top', height:250}),
   h(F.NavBar, {key:'n', overlay:true, back:'Today', title:'', trailing:[h(F.IconButton, {key:1, icon:'heart', label:'Save'}), h(F.IconButton, {key:2, icon:'more', label:'More'})]}),
   scroll(
     h('h1', {className:'fm-h2', style:{paddingTop:16}}, 'Creamy Chicken Pasta'),
     h(F.MacroLine, {kcal:545, protein:51, carbs:54, fat:14, size:'lg'}),
     h(F.CompareCard, {original:{kcal:684, protein:31}, yours:{kcal:545, protein:51}}),
     h('div', {className:'fm-group'},
       h(F.IngredientRow, {name:'Chicken breast', amount:'300 g', was:'200 g', role:'protein'}),
       h(F.IngredientRow, {name:'Skyr, natural', amount:'150 g', was:'Cream 150 g', role:'sauce'}))),
   h('div', {key:'c', className:'fm-sticky'}, h(F.Button, {variant:'glass-prominent', size:'lg', block:true, icon:'check'}, 'Mark as cooked'))
 ], null, 'dark'),
 Ph('Safety · dark', [
   h(F.NavBar, {key:'n', large:true, title:'Today', avatar:AV}),
   scroll(
     h(F.Notice, {tone:'danger', title:'Contains peanuts (peanut butter)', body:'Peanuts are your allergy. Swap or remove it to plan this recipe.', actions:[{label:'Swap it', icon:'swap'}, {label:'Remove it'}]}),
     h(F.RebalanceProposal, {title:'Your day is 90 kcal over', adjustments:[{meal:'Dinner', portion:'\u221216%', kcal:'\u221270 kcal'}], locked:[{meal:'Breakfast', reason:'eaten'}], before:{kcal:1590, protein:129}, after:{kcal:1520, protein:124}, cta:'Apply'})),
   h(F.TabBar, {key:'t', active:'today'})
 ], null, 'dark'),
 Ph('01c No profile on this phone · dark', [
   h(F.NavBar, {key:'n', back:'Consent', title:''}),
   scroll(
     h('div', {style:{display:'flex', flexDirection:'column', gap:12, paddingTop:8}},
       h('span', {style:{display:'grid', placeItems:'center', width:56, height:56, borderRadius:999, background:'var(--surface-sunken)', color:'var(--ink)'}}, h(F.Icon, {name:'user', size:28})),
       h('h1', {className:'fm-h2'}, 'Set up your profile'),
       h('p', {className:'fm-body', style:{fontSize:15, lineHeight:'21px'}}, 'Your plans are back. Your profile isn’t on this phone. Restore it from iCloud or set it up again.')),
     h(F.Notice, {tone:'offline', icon:'lock', title:'Paused until your profile is set up', items:['Building plans', 'Swapping meals and ingredients', 'Checking imported recipes for your allergens']}),
     h('div', {style:{display:'flex', alignItems:'center', gap:12, padding:'0 16px', background:'var(--surface-raised)', border:'1px solid var(--line)', borderRadius:'var(--radius-md)'}},
       h('span', {style:{color:'var(--ink-muted)'}}, h(F.Icon, {name:'cloud', size:20})),
       h('div', {style:{flex:1, minWidth:0}}, h(F.Toggle, {label:'Sync with iCloud', description:'Only in your private iCloud. We can’t read it.', checked:true})))),
   h('div', {key:'c', className:'fm-sticky'},
     h(F.Button, {variant:'primary', size:'lg', block:true}, 'Set up my profile'),
     h(F.Button, {variant:'quiet', size:'md', block:true, icon:'cloud'}, 'Restore from iCloud'))
 ], null, 'dark'),
 Ph('25d Import fallback · dark', [
   h(F.NavBar, {key:'n', back:'Cancel', title:'Add a recipe'}),
   scroll(
     h(F.NumberField, {label:'Paste a link', value:'https://blog.example.pl/zupa-dyniowa'}),
     h(F.Notice, {tone:'info', title:'We can’t read a recipe on this page', body:'Paste the recipe text and we’ll keep the link as the source.', actions:[{label:'Paste recipe text', icon:'text'}, {label:'Try another link'}]}),
     h(F.Notice, {tone:'warning', icon:'lock', title:'We can’t check this recipe for your allergens', body:'Your profile isn’t on this phone, so we don’t know your allergies. You can save it now.', actions:[{label:'Set up my profile'}]}))
 ], null, 'dark'),
 Ph('37b Where your data lives · dark', [
   h(F.NavBar, {key:'n', large:true, title:'Today', avatar:AV}),
   sheet(
     sheetHead('Where your data lives'),
     h('p', {className:'fm-h3'}, 'On this phone'),
     h('p', {style:{margin:0, font:'400 14px/20px var(--font-text)'}}, 'Your nutrition profile. It syncs to your private iCloud, which we can’t read, unless you turn sync off.'),
     h('p', {className:'fm-h3'}, 'On our servers in the EU'),
     h('p', {style:{margin:0, font:'400 14px/20px var(--font-text)'}}, 'Your account, plans, recipes, shopping lists and the record of your consents.'),
     h('p', {className:'fm-h3'}, 'Never collected'),
     h('p', {style:{margin:0, font:'400 14px/20px var(--font-text)'}}, 'Medical conditions, your date of birth, device or advertising identifiers, and your PDF files.'))
 ], null, 'dark')
]);
</script>
</body>
</html>
