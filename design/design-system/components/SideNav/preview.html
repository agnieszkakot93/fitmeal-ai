<!doctype html>
<html>
<head><meta charset="utf-8"><title>SideNav — preview</title></head>
<body>
<div id="root"></div>
<script>
var F = window.Donut, h = React.createElement;
function root(el){ ReactDOM.createRoot(document.getElementById('root')).render(el); }
function box(el){ return h('div', {style:{height:500, display:'flex', border:'1px solid var(--line)', borderRadius:16, overflow:'hidden'}}, el); }
function stop(id, e){ e.preventDefault(); }
root(h('div', {className:'fm-row', style:{padding:16, gap:24, alignItems:'flex-start'}},
  box(h(F.SideNav, {variant:'full', active:'today', onNavigate:stop, avatar:h(F.Avatar, {initials:'AK'})})),
  box(h(F.SideNav, {variant:'full', active:'plan', lang:'pl', onNavigate:stop, avatar:h(F.Avatar, {initials:'AK', label:'Profil'})})),
  box(h(F.SideNav, {variant:'rail', active:'shopping', onNavigate:stop, avatar:h(F.Avatar, {initials:'AK'})})),
  box(h(F.SideNav, {variant:'rail', active:'today', lang:'pl', onNavigate:stop, avatar:h(F.Avatar, {initials:'AK', label:'Profil'})}))));
</script>
</body>
</html>
