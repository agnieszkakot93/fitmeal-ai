<!-- @dsCard group="Screens" height=900 width=1748 page subtitle="Welcome, Goal, Calories, Macros (Advanced)" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Onboarding 1 — goal and targets</title></head>
<body>
<div id="root"></div>
<script>
var F = window.FitMeal, h = React.createElement;
function root(el){ ReactDOM.createRoot(document.getElementById('root')).render(el); }
function Ph(caption, content, footer, theme){ return h(F.PhoneFrame, {caption:caption, footer:footer, theme:theme}, content); }
function show(list){ root(h.apply(null, ['div', {className:'fm-showcase'}].concat(list))); }
function scroll(){ return h.apply(null, ['div', {className:'fm-screen-scroll'}].concat([].slice.call(arguments))); }
function cta(label, extra){ return h('div', {className:'fm-sticky'}, extra || null, h(F.Button, {variant:'primary', size:'lg', block:true}, label)); }
function q(title, sub){ return h('div', {style:{display:'flex', flexDirection:'column', gap:8, paddingTop:8}}, h('h1', {className:'fm-hxl', style:{fontSize:32, lineHeight:'36px'}}, title), sub ? h('p', {className:'fm-callout'}, sub) : null); }
function card(){ return h.apply(null, ['div', {style:{background:'var(--surface-raised)', border:'1px solid var(--line)', borderRadius:'var(--radius-lg)', padding:16, display:'flex', flexDirection:'column', gap:12}}].concat([].slice.call(arguments))); }
function row(label, value, icon){ return h('div', {style:{display:'flex', alignItems:'center', gap:12, padding:'12px 16px', borderBottom:'1px solid var(--line)', background:'var(--surface-raised)'}},
  icon ? h('span', {style:{color:'var(--ink-muted)'}}, h(F.Icon, {name:icon, size:20})) : null,
  h('span', {style:{flex:1, font:'500 16px/22px var(--font-text)'}}, label),
  h('span', {style:{font:'500 15px/20px var(--font-text)', color:'var(--ink-muted)'}}, value),
  h('span', {style:{color:'var(--ink-faint)'}}, h(F.Icon, {name:'chevron-right', size:18}))); }
var TODAY_MEALS = [
  h(F.MealCard, {key:1, slot:'Breakfast', time:'08:00', title:'Protein Snickers Shake', kcal:520, protein:44, carbs:52, fat:14, status:'eaten', swappable:false, badges:[{label:'Prepare fresh', icon:'clock'}]}),
  h(F.MealCard, {key:2, slot:'Lunch', time:'13:30', title:'Chicken Teriyaki', kcal:548, protein:49, carbs:58, fat:12, badges:[{label:'Meal prep \u00b7 1/2', tone:'paprika', icon:'repeat'}]}),
  h(F.MealCard, {key:3, slot:'Dinner', time:'19:00', title:'Turkey Pasta Bake', kcal:429, protein:32, carbs:40, fat:14, badges:[{label:'Meal prep \u00b7 1/2', tone:'paprika', icon:'repeat'}]})
];
function daySummary(){ return card(
  h('div', {style:{display:'flex', alignItems:'center', gap:16}},
    h(F.MacroRing, {value:1497, target:1500, size:112, stroke:10, macros:{protein:{share:.32}, carbs:{share:.35}, fat:{share:.33}}}),
    h('div', {style:{flex:1, display:'flex', flexDirection:'column', gap:10}},
      h(F.MacroBar, {macro:'protein', value:125, target:115, mode:'min', compact:true}),
      h(F.MacroBar, {macro:'carbs', value:150, target:140, compact:true}),
      h(F.MacroBar, {macro:'fat', value:40, target:50, compact:true})))); }
show([
 Ph('01 Welcome', [
   h('div', {key:'a', style:{flex:1, display:'flex', flexDirection:'column', justifyContent:'center', gap:20, padding:'0 20px'}},
     h('p', {className:'fm-cap', style:{color:'var(--paprika-ink)'}}, 'FitMeal'),
     h('h1', {className:'fm-hxl'}, 'Your favorite food. Your macros. Less waste.'),
     h('p', {className:'fm-callout'}, 'Paste any recipe. FitMeal fits it to your calories and protein, builds your week and writes the shopping list.'),
     h(F.CompareCard, {originalLabel:'Recipe you found', yoursLabel:'Fitted to you', original:{kcal:720, protein:29}, yours:{kcal:510, protein:48}, foundLabel:'Same dish, your numbers'})),
   h('div', {key:'b', className:'fm-sticky'},
     h(F.Button, {variant:'primary', size:'lg', block:true}, 'Get started'),
     h(F.Button, {variant:'quiet', size:'md', block:true}, 'I already have an account'),
     h('p', {className:'fm-foot', style:{textAlign:'center'}}, 'Not medical advice. Pregnant, managing a condition or recovering from an eating disorder? Talk to a dietitian first.'))
 ]),
 Ph('02 Goal', [
   h(F.OnboardingProgress, {key:'p', step:1}),
   scroll(q('What\u2019s your goal?', 'We\u2019ll suggest numbers. You can change every one of them.'),
     h('div', {className:'fm-stack', style:{gap:8}},
       h(F.SelectCard, {icon:'flame', title:'Lose fat', description:'About 400\u2013500 kcal under maintenance', selected:true}),
       h(F.SelectCard, {icon:'target', title:'Maintain', description:'Eat at maintenance, keep protein high'}),
       h(F.SelectCard, {icon:'plus', title:'Build muscle', description:'A small surplus with a protein minimum'}),
       h(F.SelectCard, {icon:'edit', title:'Custom target', description:'Type your own calories and macros'}))),
   h('div', {key:'c'}, cta('Continue'))
 ]),
 Ph('03 Calories', [
   h(F.OnboardingProgress, {key:'p', step:2}),
   scroll(q('How many calories a day?', 'Suggested for fat loss. Type your own if you have a number from a dietitian or coach.'),
     h(F.NumberField, {large:true, value:'1500', unit:'kcal'}),
     h('div', {style:{display:'flex', gap:10, padding:12, borderRadius:'var(--radius-md)', background:'var(--surface-sunken)'}},
       h('span', {style:{color:'var(--ink-muted)'}}, h(F.Icon, {name:'info', size:20})),
       h('p', {className:'fm-foot', style:{color:'var(--ink)'}}, 'Below 1,200 kcal we\u2019ll ask you to confirm. FitMeal never builds a plan under a safe minimum without telling you.'))),
   h('div', {key:'c'}, cta('Continue'))
 ]),
 Ph('04 Macros \u00b7 Advanced', [
   h(F.OnboardingProgress, {key:'p', step:3}),
   scroll(q('Set your macros'),
     h(F.SegmentedControl, {options:['Simple','Advanced'], value:'Advanced', label:'Macro mode'}),
     h('div', {className:'fm-stack'},
       h(F.NumberField, {label:'Protein', value:'115', unit:'g minimum', hint:'Hit at least this. More is fine.'}),
       h('div', {style:{display:'flex', gap:12}}, h(F.NumberField, {label:'Fat', value:'50', unit:'g'}), h(F.NumberField, {label:'Carbs', value:'140', unit:'g'}))),
     card(h('span', {className:'fm-cap'}, 'Adds up to'), h(F.MacroLine, {kcal:1470, protein:115, carbs:140, fat:50, size:'lg'}), h('p', {className:'fm-foot'}, '30 kcal under your target \u2014 we\u2019ll fill it with carbs.'))),
   h('div', {key:'c'}, cta('Continue'))
 ])
]);
</script>
</body>
</html>
