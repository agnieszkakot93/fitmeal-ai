<!-- @dsCard group="Screens" height=900 width=2179 page subtitle="The 14 EU allergens with severity tiers, diet and free-text exclusions, Preferences, Cooking and budget with the Thursday plan reminder, Sign in with Apple" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Onboarding 3 — exclusions, preferences, cooking, sign-in</title></head>
<body>
<div id="root"></div>
<script>
var F = window.FitMeal, h = React.createElement;
function root(el){ ReactDOM.createRoot(document.getElementById('root')).render(el); }
function Ph(caption, content, footer, theme){ return h(F.PhoneFrame, {caption:caption, footer:footer, theme:theme}, content); }
function show(list){ root(h.apply(null, ['div', {className:'fm-showcase'}].concat(list))); }
function scroll(){ return h.apply(null, ['div', {className:'fm-screen-scroll'}].concat([].slice.call(arguments))); }
function cta(label, extra, disabled){ return h('div', {className:'fm-sticky'}, extra || null, h(F.Button, {variant:'primary', size:'lg', block:true, disabled:!!disabled}, label)); }
function q(title, sub){ return h('div', {style:{display:'flex', flexDirection:'column', gap:8, paddingTop:8}}, h('h1', {className:'fm-hxl', style:{fontSize:30, lineHeight:'34px'}}, title), sub ? h('p', {className:'fm-callout'}, sub) : null); }
function card(){ return h.apply(null, ['div', {style:{background:'var(--surface-raised)', border:'1px solid var(--line)', borderRadius:'var(--radius-lg)', padding:16, display:'flex', flexDirection:'column', gap:12}}].concat([].slice.call(arguments))); }
function row(label, value, icon, danger){ return h('div', {style:{display:'flex', alignItems:'center', gap:12, padding:'12px 16px', borderBottom:'1px solid var(--line)', background:'var(--surface-raised)'}},
  icon ? h('span', {style:{color: danger ? 'var(--danger)' : 'var(--ink-muted)'}}, h(F.Icon, {name:icon, size:20})) : null,
  h('span', {style:{flex:1, font:'500 16px/22px var(--font-text)', color: danger ? 'var(--danger)' : 'var(--ink)'}}, label),
  value ? h('span', {style:{font:'500 15px/20px var(--font-text)', color:'var(--ink-muted)'}}, value) : null,
  h('span', {style:{color:'var(--ink-faint)'}}, h(F.Icon, {name:'chevron-right', size:18}))); }
function label(t){ return h('span', {className:'fm-cap'}, t); }
function sheet(){ return h('div', {key:'s', className:'fm-scrim'}, h.apply(null, ['div', {className:'fm-sheet'}, h('span', {className:'fm-sheet-grab'})].concat([].slice.call(arguments)))); }
function sheetHead(title){ return h('div', {style:{display:'flex', justifyContent:'space-between', alignItems:'center'}}, h('h2', {className:'fm-h2'}, title), h(F.IconButton, {icon:'close', label:'Close'})); }
var AV = h(F.Avatar, {initials:'OL', label:'Profile'});
var PREP = {portion:'1/2', cook:'Wed', eatBy:'Thu'};
var TODAY_MEALS = [
  h(F.MealCard, {key:1, slot:'Breakfast', time:'08:00', title:'Protein Snickers Shake', kcal:520, protein:44, carbs:52, fat:14, status:'eaten', badges:[{label:'Prepare fresh', icon:'clock'}]}),
  h(F.MealCard, {key:2, slot:'Lunch', time:'13:30', title:'Chicken Teriyaki', kcal:548, protein:49, carbs:58, fat:12, status:'cooked', prep:PREP}),
  h(F.MealCard, {key:3, slot:'Dinner', time:'19:00', title:'Turkey Pasta Bake', kcal:429, protein:32, carbs:40, fat:14, prep:PREP})
];
function daySummary(){ return card(
  h('div', {style:{display:'flex', alignItems:'center', gap:16}},
    h(F.MacroRing, {value:1497, target:1500, size:112, stroke:10, macros:{protein:{share:.32}, carbs:{share:.35}, fat:{share:.33}}}),
    h('div', {style:{flex:1, display:'flex', flexDirection:'column', gap:10}},
      h(F.MacroBar, {macro:'protein', value:125, target:115, mode:'min', compact:true}),
      h(F.MacroBar, {macro:'carbs', value:150, target:140, compact:true}),
      h(F.MacroBar, {macro:'fat', value:40, target:50, compact:true})))); }
var UP_NEXT = h(F.BottomAccessory, {icon:'clock', title:'Up next · Dinner 19:00', subtitle:'Turkey Pasta Bake · meal prep 1/2', action:'Eat'});
show([
 Ph('10 Allergens', [
   h(F.OnboardingProgress, {key:'p', step:10}),
   scroll(q('Anything you can’t eat?', 'The 14 EU allergens. Pick the ones that apply, and how strict to be.'),
     h('div', {className:'fm-stack', style:{gap:8}},
       h(F.ExclusionRow, {name:'Peanuts', severity:'allergy'}),
       h(F.ExclusionRow, {name:'Milk', examples:'incl. whey, skyr', severity:'intolerance'}),
       h(F.ExclusionRow, {name:'Fish', severity:'dislike'})),
     h('div', {className:'fm-stack', style:{gap:8}}, label('Add more'),
       h('div', {className:'fm-row', style:{gap:6}}, ['Cereals with gluten','Crustaceans','Eggs','Soybeans','Tree nuts','Celery','Mustard','Sesame','Sulphites','Lupin','Molluscs'].map(function(n){ return h(F.Chip, {key:n, icon:'plus'}, n); })))),
   h('div', {key:'c'}, cta('Continue'))
 ]),
 Ph('11 Diet & other exclusions', [
   h(F.OnboardingProgress, {key:'p', step:11}),
   scroll(q('Anything else?', 'Diet choices and foods that aren’t on the allergen list.'),
     h('div', {className:'fm-stack', style:{gap:8}}, label('Diet'),
       h('div', {className:'fm-row', style:{gap:6}}, h(F.Chip, null, 'Meat'), h(F.Chip, {selected:true}, 'Pork'), h(F.Chip, null, 'Poultry'), h(F.Chip, null, 'All animal products'))),
     h('div', {className:'fm-stack', style:{gap:8}}, label('Other'),
       h(F.NumberField, {value:'kolendra', placeholder:'Type a food'}),
       card(
         h('p', {style:{margin:0, font:'500 15px/21px var(--font-text)'}}, 'We matched “kolendra” to ', h('b', null, 'Coriander (fresh)'), '. Is that right?'),
         h('div', {className:'fm-row', style:{gap:8}}, h(F.Button, {variant:'primary', size:'sm', icon:'check'}, 'Yes, exclude it'), h(F.Button, {variant:'quiet', size:'sm'}, 'Pick another'))),
       h(F.Notice, {tone:'warning', title:'No match for “sos Y”', body:'We can’t enforce an exclusion we can’t recognise. Pick a matching food or remove it.', actions:[{label:'Pick a match'}, {label:'Remove'}]}))),
   h('div', {key:'c'}, cta('Continue'))
 ]),
 Ph('12 Preferences', [
   h(F.OnboardingProgress, {key:'p', step:12}),
   scroll(q('What do you like?', 'Pick any. We’ll rank recipes by these.'),
     h('div', {className:'fm-stack', style:{gap:8}}, label('Style'),
       h('div', {className:'fm-row', style:{gap:8}}, h(F.Chip, {selected:true}, 'High protein'), h(F.Chip, null, 'Vegetarian'), h(F.Chip, null, 'Vegan'), h(F.Chip, {selected:true}, 'Mediterranean'), h(F.Chip, {selected:true}, 'Quick meals'), h(F.Chip, null, 'Low-cost'), h(F.Chip, null, 'Meal-prep friendly'))),
     h('div', {className:'fm-stack', style:{gap:8}}, label('Breakfast'), h(F.SegmentedControl, {options:['Sweet','Savory','Either'], value:'Sweet'})),
     h('div', {className:'fm-stack', style:{gap:8}}, label('Equipment'),
       h('div', {className:'fm-row', style:{gap:8}}, h(F.Chip, {selected:true}, 'Oven'), h(F.Chip, {selected:true}, 'Air fryer'), h(F.Chip, {selected:true}, 'Blender'), h(F.Chip, null, 'Microwave'), h(F.Chip, null, 'Thermomix')))),
   h('div', {key:'c'}, cta('Continue'))
 ]),
 Ph('13–14 Budget, meal prep & cooking · plan reminder', [
   h(F.OnboardingProgress, {key:'p', step:14}),
   scroll(q('How do you cook?'),
     h('div', {className:'fm-stack', style:{gap:8}}, label('Max cooking time'), h(F.SegmentedControl, {options:['15','30','45','60+'], value:'30'})),
     h('div', {className:'fm-stack', style:{gap:8}}, label('Cook once for'), h(F.SegmentedControl, {options:['1 day','2 days','3 days'], value:'2 days'}),
       h('p', {className:'fm-foot'}, 'Lunch and dinner are batched; shakes stay fresh. A batch never outlasts its fridge life.')),
     h('div', {className:'fm-stack', style:{gap:8}}, label('Budget'),
       h(F.SegmentedControl, {options:['Economy','Standard','Flexible'], value:'Economy'}),
       h('p', {className:'fm-foot'}, 'Economy repeats ingredients across meals, so your list gets shorter.')),
     card(
       h('div', {style:{display:'flex', gap:12, alignItems:'flex-start'}},
         h('span', {style:{display:'grid', placeItems:'center', width:36, height:36, borderRadius:999, background:'var(--basil-soft)', color:'var(--basil-ink)', flex:'none'}}, h(F.Icon, {name:'plan', size:20})),
         h('div', {className:'fm-stack', style:{gap:2}},
           h('p', {style:{margin:0, font:'650 16px/22px var(--font-text)'}}, 'Plan reminder'),
           h('p', {className:'fm-foot', style:{fontSize:14, lineHeight:'20px'}}, 'Get a reminder on Thursdays to plan next week. It’s the only notification we send.'))),
       h('div', {className:'fm-row', style:{gap:8, paddingLeft:48}},
         h(F.Button, {variant:'secondary', size:'sm'}, 'Remind me on Thursdays'),
         h(F.Button, {variant:'quiet', size:'sm'}, 'Not now')))),
   h('div', {key:'c'}, cta('Create my plan'))
 ]),
 Ph('15 Sign in to save your plan', [
   h(F.NavBar, {key:'n', large:true, title:'Your week', subtitle:'22–28 Sep · 7 days · on target'}),
   scroll(daySummary()),
   sheet(
     h('h2', {className:'fm-h2'}, 'Save your plan'),
     h('p', {className:'fm-callout', style:{color:'var(--ink)'}}, 'Sign in to keep your plans and recipes. Your profile stays on this phone. Hiding your email is fine.'),
     h(F.Button, {variant:'premium', size:'lg', block:true}, ' Sign in with Apple'),
     h('p', {className:'fm-foot', style:{textAlign:'center'}}, 'By continuing you accept the Terms and Privacy policy.'))
 ])
]);
</script>
</body>
</html>
