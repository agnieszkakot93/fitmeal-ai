<!doctype html>
<html>
<head><meta charset="utf-8"><title>SegmentedControl — preview</title></head>
<body>
<div id="root"></div>
<script>
var F = window.FitMeal, h = React.createElement;
function root(el){ ReactDOM.createRoot(document.getElementById('root')).render(el); }
root(h('div', {className:'fm-stack', style:{padding:16, maxWidth:360}},
  h(F.SegmentedControl, {options:['Simple','Advanced'], value:'Simple', label:'Macro mode'}),
  h(F.SegmentedControl, {options:['2','3','4','5'], value:'3', label:'Meals per day'}),
  h(F.SegmentedControl, {options:['3 days','5 days','7 days'], value:'7 days', label:'Plan length'})));
</script>
</body>
</html>
