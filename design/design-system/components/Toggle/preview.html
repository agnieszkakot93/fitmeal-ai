<!doctype html>
<html>
<head><meta charset="utf-8"><title>Toggle — preview</title></head>
<body>
<div id="root"></div>
<script>
var F = window.FitMeal, h = React.createElement;
function root(el){ ReactDOM.createRoot(document.getElementById('root')).render(el); }
root(h('div', {style:{padding:'4px 16px', maxWidth:360}},
  h(F.Toggle, {label:'Reuse ingredients', description:'Fewer unique items on your list', checked:true}),
  h(F.Toggle, {label:'Minimize waste', checked:true}),
  h(F.Toggle, {label:'Suggest substitutions', checked:false})));
</script>
</body>
</html>
