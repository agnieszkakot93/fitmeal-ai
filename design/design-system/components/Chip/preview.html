<!doctype html>
<html>
<head><meta charset="utf-8"><title>Chip — preview</title></head>
<body>
<div id="root"></div>
<script>
var F = window.FitMeal, h = React.createElement;
function root(el){ ReactDOM.createRoot(document.getElementById('root')).render(el); }
root(h('div', {className:'fm-row', style:{padding:16, gap:8}},
  h(F.Chip, {selected:true}, 'High protein'), h(F.Chip, null, 'Vegetarian'), h(F.Chip, {selected:true}, 'Quick meals'),
  h(F.Chip, null, 'Mediterranean'), h(F.Chip, {selected:true}, 'Meal-prep friendly'), h(F.Chip, {icon:'wallet'}, 'Low-cost'),
  h(F.Chip, {icon:'flame'}, 'Air fryer'), h(F.Chip, null, 'Savory breakfast')));
</script>
</body>
</html>
