<!doctype html>
<html>
<head><meta charset="utf-8"><title>IconButton — preview</title></head>
<body>
<div id="root"></div>
<script>
var F = window.FitMeal, h = React.createElement;
function root(el){ ReactDOM.createRoot(document.getElementById('root')).render(el); }
root(h('div', {className:'fm-row', style:{padding:16, borderRadius:20, background:'linear-gradient(120deg, var(--paprika) 0 30%, var(--macro-carbs) 30% 55%, var(--basil) 55% 80%, var(--macro-fat) 80%)'}},
  h(F.IconButton, {icon:'chevron-left', label:'Back', variant:'glass'}), h(F.IconButton, {icon:'more', label:'More', variant:'glass'}),
  h(F.IconButton, {icon:'check', label:'Done', variant:'glass-prominent'}), h(F.IconButton, {icon:'close', label:'Close', variant:'raised'}),
  h(F.IconButton, {icon:'minus', label:'Less', variant:'sunken', size:18}), h(F.IconButton, {icon:'plus', label:'More', variant:'sunken', size:18})));
</script>
</body>
</html>
