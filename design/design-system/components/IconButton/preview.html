<!doctype html>
<html>
<head><meta charset="utf-8"><title>IconButton — preview</title></head>
<body>
<div id="root"></div>
<script>
var F = window.FitMeal, h = React.createElement;
function root(el){ ReactDOM.createRoot(document.getElementById('root')).render(el); }
root(h('div', {className:'fm-row', style:{padding:16}},
  h(F.IconButton, {icon:'more', label:'More'}), h(F.IconButton, {icon:'close', label:'Close', variant:'raised'}),
  h(F.IconButton, {icon:'minus', label:'Less', variant:'sunken', size:18}), h(F.IconButton, {icon:'plus', label:'More', variant:'sunken', size:18})));
</script>
</body>
</html>
