<!doctype html>
<html>
<head><meta charset="utf-8"><title>ProfileFileCard — preview</title></head>
<body>
<div id="root"></div>
<script>
var F = window.Donut, h = React.createElement;
function root(el){ ReactDOM.createRoot(document.getElementById('root')).render(el); }
root(h('div', {className:'fm-row', style:{padding:16, gap:32, alignItems:'flex-start'}},
  h('div', {className:'fm-stack', style:{width:375, gap:16}},
    h(F.ProfileFileCard, {lastDownloaded:'12 Oct 2026'}),
    h(F.ProfileFileCard, {mode:'load', title:'Have a profile file?', error:true})),
  h('div', {className:'fm-stack', style:{width:375, gap:16}},
    h(F.ProfileFileCard, {lang:'pl', persistRefused:true}))));
</script>
</body>
</html>
