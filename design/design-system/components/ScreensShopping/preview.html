<!-- @dsCard group="Screens" height=900 width=3472 page subtitle="Shopping list (store-walk order, no prices), Economy Mode v1 preview, Paywall, Profile with Privacy & health (profile on this phone, iCloud sync, plan reminder, export), Where your data lives, Delete account (and the iCloud-not-reachable case)" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Shopping, paywall and profile</title></head>
<body>
<div id="root"></div>
<script>
var F = window.FitMeal, h = React.createElement;
function root(el){ ReactDOM.createRoot(document.getElementById('root')).render(el); }
function Ph(caption, content, footer, theme){ return h(F.PhoneFrame, {caption:caption, footer:footer, theme:theme}, content); }
function show(list){ root(h.apply(null, ['div', {className:'fm-showcase'}].concat(list))); }
function scroll(){ return h.apply(null, ['div', {className:'fm-screen-scroll'}].concat([].slice.call(arguments))); }
function cta(label, extra, disabled){ return h('div', {className:'fm-sticky'}, extra || null, h(F.Button, {variant:'primary', size:'lg', block:true, disabled:!!disabled}, label)); }
function q(title, sub){ return h('div', {style:{display:'flex', flexDirection:'column', gap:8, paddingTop:8}}, h('h1', {className:'fm-hxl', style:{fontSize:30, lineHeight:'34px'}}, title), sub ? h('p', {className:'fm-callout'}, sub) : null); }
function card(){ return h.apply(null, ['div', {style:{background:'var(--surface-raised)', border:'1px solid var(--line)', borderRadius:'var(--radius-lg)', padding:16, display:'flex', flexDirection:'column', gap:12}}].concat([].slice.call(arguments))); }
function row(label, value, icon, danger){ return h('div', {style:{display:'flex', alignItems:'center', gap:12, padding:'12px 16px', borderBottom:'1px solid var(--line)', background:'var(--surface-raised)'}},
  icon ? h('span', {style:{color: danger ? 'var(--danger)' : 'var(--ink-muted)'}}, h(F.Icon, {name:icon, size:20})) : null,
  h('span', {style:{flex:1, font:'500 16px/22px var(--font-text)', color: danger ? 'var(--danger)' : 'var(--ink)'}}, label),
  value ? h('span', {style:{font:'500 15px/20px var(--font-text)', color:'var(--ink-muted)'}}, value) : null,
  h('span', {style:{color:'var(--ink-faint)'}}, h(F.Icon, {name:'chevron-right', size:18}))); }
function label(t){ return h('span', {className:'fm-cap'}, t); }
function sheet(){ return h('div', {key:'s', className:'fm-scrim'}, h.apply(null, ['div', {className:'fm-sheet'}, h('span', {className:'fm-sheet-grab'})].concat([].slice.call(arguments)))); }
function sheetHead(title){ return h('div', {style:{display:'flex', justifyContent:'space-between', alignItems:'center'}}, h('h2', {className:'fm-h2'}, title), h(F.IconButton, {icon:'close', label:'Close'})); }
var AV = h(F.Avatar, {initials:'OL', label:'Profile'});
var PREP = {portion:'1/2', cook:'Wed', eatBy:'Thu'};
var TODAY_MEALS = [
  h(F.MealCard, {key:1, slot:'Breakfast', time:'08:00', title:'Protein Snickers Shake', kcal:520, protein:44, carbs:52, fat:14, status:'eaten', badges:[{label:'Prepare fresh', icon:'clock'}]}),
  h(F.MealCard, {key:2, slot:'Lunch', time:'13:30', title:'Chicken Teriyaki', kcal:548, protein:49, carbs:58, fat:12, status:'cooked', prep:PREP}),
  h(F.MealCard, {key:3, slot:'Dinner', time:'19:00', title:'Turkey Pasta Bake', kcal:429, protein:32, carbs:40, fat:14, prep:PREP})
];
function daySummary(){ return card(
  h('div', {style:{display:'flex', alignItems:'center', gap:16}},
    h(F.MacroRing, {value:1497, target:1500, size:112, stroke:10, macros:{protein:{share:.32}, carbs:{share:.35}, fat:{share:.33}}}),
    h('div', {style:{flex:1, display:'flex', flexDirection:'column', gap:10}},
      h(F.MacroBar, {macro:'protein', value:125, target:115, mode:'min', compact:true}),
      h(F.MacroBar, {macro:'carbs', value:150, target:140, compact:true}),
      h(F.MacroBar, {macro:'fat', value:40, target:50, compact:true})))); }
var UP_NEXT = h(F.BottomAccessory, {icon:'clock', title:'Up next · Dinner 19:00', subtitle:'Turkey Pasta Bake · meal prep 1/2', action:'Eat'});
/* Profile helpers */
function row2(label, sub, icon, trailing){ return h('div', {style:{display:'flex', alignItems:'center', gap:12, padding:'12px 16px', borderBottom:'1px solid var(--line)', background:'var(--surface-raised)'}},
  h('span', {style:{color:'var(--ink-muted)', flex:'none'}}, h(F.Icon, {name:icon, size:20})),
  h('span', {style:{flex:1, minWidth:0, display:'flex', flexDirection:'column', gap:2}},
    h('span', {style:{font:'500 16px/22px var(--font-text)'}}, label),
    h('span', {className:'fm-foot'}, sub)),
  trailing || h('span', {style:{color:'var(--ink-faint)'}}, h(F.Icon, {name:'chevron-right', size:18}))); }
function toggleRow(icon, label, desc, on){ return h('div', {style:{display:'flex', alignItems:'center', gap:12, padding:'0 16px', borderBottom:'1px solid var(--line)', background:'var(--surface-raised)'}},
  h('span', {style:{color:'var(--ink-muted)', flex:'none'}}, h(F.Icon, {name:icon, size:20})),
  h('div', {style:{flex:1, minWidth:0}}, h(F.Toggle, {label:label, description:desc, checked:on}))); }
function privacyGroup(reminder){ return h('div', {key:'pg', className:'fm-group'},
  row('Nutrition profile', 'On this phone', 'user'),
  toggleRow('cloud', 'Sync with iCloud', 'Only in your private iCloud. We can’t read it.', true),
  reminder === 'denied'
    ? row2('Plan reminder · Thursdays', 'Off in iOS Settings', 'plan', h('button', {type:'button', className:'fm-link', style:{minHeight:44}}, 'Open Settings'))
    : row('Plan reminder · Thursdays', 'On', 'plan'),
  row('Health notice', '', 'info'),
  row('Health-data consent', 'Given 24 Sep', 'shield'),
  row2('Export my data', 'Combines the profile from this phone with your data from our servers.', 'doc'),
  row('Delete account', '', 'trash', true)); }
function profileSheet(children){ return h('div', {key:'s', className:'fm-scrim'},
  h('div', {className:'fm-sheet is-page'},
    h('span', {className:'fm-sheet-grab'}),
    h('div', {className:'fm-nav-row'}, h('span', {className:'fm-nav-spacer'}), h('span', {className:'fm-nav-title'}, 'Profile'), h(F.IconButton, {icon:'check', label:'Done', variant:'glass-prominent'})),
    scroll.apply(null, children))); }
function place(icon, title, body){ return h('div', {style:{display:'flex', gap:12, alignItems:'flex-start'}},
  h('span', {style:{display:'grid', placeItems:'center', width:32, height:32, borderRadius:999, background:'var(--basil-soft)', color:'var(--basil-ink)', flex:'none'}}, h(F.Icon, {name:icon, size:18, weight:2})),
  h('div', {className:'fm-stack', style:{gap:2}},
    h('p', {style:{margin:0, font:'650 16px/22px var(--font-text)'}}, title),
    h('p', {style:{margin:0, font:'400 14px/20px var(--font-text)', color:'var(--ink)'}}, body))); }
function deleteSheet(icloudUnreachable){ return sheet(
  h('span', {style:{display:'grid', placeItems:'center', width:48, height:48, borderRadius:999, background:'var(--danger-soft)', color:'var(--danger)'}}, h(F.Icon, {name:'trash', size:24})),
  h('h2', {className:'fm-h2'}, 'Delete your account?'),
  h('p', {className:'fm-body', style:{fontSize:15, lineHeight:'21px'}}, 'Permanently deletes your account, plans and private imports from our servers, and your profile from this phone and iCloud. We keep a record of your consents only as long as the law requires.'),
  icloudUnreachable ? h(F.Notice, {tone:'offline', icon:'cloud', title:'We can’t reach your iCloud right now', body:'Your profile may stay in your iCloud. To remove it, open iOS Settings › your name › iCloud › Manage Storage › FitMeal and delete its data.'}) : null,
  h(F.Notice, {tone:'offline', icon:'info', body:'Your App Store subscription isn’t cancelled automatically. Manage it in Settings › Apple ID › Subscriptions.'}),
  h(F.Button, {variant:'danger', size:'lg', block:true}, 'Delete account'),
  h(F.Button, {variant:'quiet', size:'md', block:true}, 'Export my data first')); }
show([
 Ph('34 Shopping list', [
   h(F.NavBar, {key:'n', large:true, title:'Shopping', subtitle:'22–28 Sep · 23 items', trailing:h(F.IconButton, {icon:'more', label:'List options'}), avatar:AV}),
   scroll(
     h(F.SectionHeader, {title:'Vegetables'}),
     h('div', {className:'fm-group'}, h(F.ShoppingItem, {name:'Spinach', qty:'300 g', checked:true}), h(F.ShoppingItem, {name:'Peppers', qty:'5 pcs'})),
     h(F.SectionHeader, {title:'Meat & fish'}),
     h('div', {className:'fm-group'},
       h(F.ShoppingItem, {name:'Chicken breast', qty:'1.2 kg', packages:'3 × 400 g', checked:true, extra:'200 g'}),
       h(F.ShoppingItem, {name:'Turkey mince', qty:'600 g', packages:'2 × 300 g'})),
     h(F.SectionHeader, {title:'Dairy & eggs'}),
     h('div', {className:'fm-group'}, h(F.ShoppingItem, {name:'Skyr, natural', qty:'1.2 kg', packages:'4 × 300 g cup'}))),
   h(F.TabBar, {key:'t', active:'shopping', accessory:h(F.BottomAccessory, {icon:'cart', title:'4 of 23 in the basket', subtitle:'19 left', progress:4/23})})
 ]),
 Ph('35 Economy Mode preview', [
   h(F.NavBar, {key:'n', back:'Plan', title:''}),
   scroll(
     h('h1', {className:'fm-h2'}, 'We found a simpler week'),
     h('p', {className:'fm-callout'}, 'Same kind of meals, reshuffled so ingredients repeat and your list gets shorter.'),
     h(F.LockedPreview, {kicker:'Economy version found', stats:[{label:'Unique items', from:'34', to:'23'},{label:'Calories', from:'1,500', to:'1,500'},{label:'Protein', from:'≥115 g', to:'≥115 g'}], note:'Every day still within your targets and exclusions.', cta:'Unlock Economy Mode'}),
     h(F.Button, {variant:'quiet', size:'md', block:true}, 'Keep my current week'))
 ]),
 Ph('36 Paywall', [
   h('div', {key:'x', style:{display:'flex', justifyContent:'flex-end', padding:'0 12px'}}, h(F.IconButton, {icon:'close', label:'Close', variant:'glass'})),
   scroll(
     h('h1', {className:'fm-h2'}, 'Plan every week without counting'),
     h('div', {className:'fm-stack', style:{gap:8}},
       h(F.SegmentedControl, {options:['Monthly','Yearly · save 33%'], value:'Yearly · save 33%'}),
       h(F.PlanCard, {tier:'standard', name:'Standard', flag:'Most popular', selected:true, promise:'Plan my week for me', price:'199.99 zł', period:'/ year', subprice:'16.67 zł / month', features:['5- and 7-day plans with meal prep','~30 imports a month + PDF','Swaps with rebalancing proposals','Economy Mode']}),
       h(F.PlanCard, {tier:'premium', name:'Premium', flag:'Coming soon', soon:true, promise:'Optimize food, shopping and cost', price:'329.99 zł', period:'/ year'}))),
   h('div', {key:'c'}, cta('Start 7-day free trial')),
   h('p', {key:'f', className:'fm-foot', style:{textAlign:'center', padding:'0 20px 8px'}}, '7 days free, then 199.99 zł a year. Cancel anytime in your Apple ID settings.', h('br'), 'Restore purchases · Terms · Privacy')
 ]),
 Ph('37 Profile (from the avatar)', [
   h(F.NavBar, {key:'n', large:true, title:'Today', avatar:AV}),
   scroll(daySummary()),
   profileSheet([
     h('div', {key:'me', style:{display:'flex', alignItems:'center', gap:14}},
       h(F.Avatar, {initials:'OL', size:60, label:'Change photo'}),
       h('div', {className:'fm-stack', style:{gap:4}}, h('p', {className:'fm-h3'}, 'Ola'), h(F.Badge, {tone:'basil', icon:'check'}, 'Standard · renews 24 Sep 2027'))),
     h('div', {key:'st', style:{display:'grid', gridTemplateColumns:'1fr 1fr', gap:8}},
       h(F.StatTile, {value:'17', label:'Meals eaten', note:'This week'}),
       h(F.StatTile, {value:'96', unit:'%', label:'Protein target hit'})),
     h(F.SectionHeader, {key:'th', title:'My targets'}),
     h('div', {key:'tg', className:'fm-group'}, row('Calories & macros', '1,500 · 115 P', 'target'), row('Exclusions', 'Peanuts, milk +2', 'alert'), row('Meal prep', '2 days', 'repeat')),
     h(F.SectionHeader, {key:'ph', title:'Privacy & health'}),
     privacyGroup('on')])
 ]),
 Ph('37 Privacy & health · reminder off', [
   h(F.NavBar, {key:'n', large:true, title:'Today', avatar:AV}),
   scroll(daySummary()),
   profileSheet([
     h(F.SectionHeader, {key:'ph', title:'Privacy & health'}),
     privacyGroup('denied'),
     h('p', {key:'f', className:'fm-foot'}, 'Withdrawing health-data consent deletes your account and your profile.')])
 ]),
 Ph('37b Where your data lives', [
   h(F.NavBar, {key:'n', large:true, title:'Today', avatar:AV}),
   profileSheet([h(F.SectionHeader, {key:'ph', title:'Privacy & health'}), privacyGroup('on')]),
   h('div', {key:'s2', className:'fm-scrim'},
     h('div', {className:'fm-sheet'},
       h('span', {className:'fm-sheet-grab'}),
       sheetHead('Where your data lives'),
       place('user', 'On this phone', 'Your nutrition profile: targets, allergies and other exclusions, and body data if you added it. It syncs to your private iCloud, which we can’t read, unless you turn sync off. We receive it only to build a plan or swap, and don’t keep it.'),
       place('shield', 'On our servers in the EU', 'Your account, plans, meals you mark as eaten, saved and imported recipes, shopping lists and the record of your consents. Recipe text you import is read by our AI provider in the EU; we keep only the recipe.'),
       place('close', 'Never collected', 'Medical conditions, your date of birth, device or advertising identifiers, and your PDF files.'),
       h(F.Button, {variant:'quiet', size:'md', block:true}, 'Read the privacy policy')))
 ]),
 Ph('38 Delete account', [
   h(F.NavBar, {key:'n', back:'Profile', title:'Privacy & health'}),
   deleteSheet(false)
 ]),
 Ph('38 Delete account · iCloud not reachable', [
   h(F.NavBar, {key:'n', back:'Profile', title:'Privacy & health'}),
   deleteSheet(true)
 ])
]);
</script>
</body>
</html>
