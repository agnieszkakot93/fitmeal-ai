<!doctype html>
<html>
<head><meta charset="utf-8"><title>Icon — preview</title></head>
<body>
<div id="root"></div>
<script>
var F = window.FitMeal, h = React.createElement;
function root(el){ ReactDOM.createRoot(document.getElementById('root')).render(el); }
var names = F.Icon.names;
root(h('div', {className:'fm-row', style:{padding:16, gap:18}}, names.map(function(n){
  return h('span', {key:n, title:n, style:{display:'inline-flex', flexDirection:'column', alignItems:'center', gap:4, width:56, font:'500 11px/14px var(--font-text)', color:'var(--ink-muted)'}},
    h('span', {style:{color:'var(--ink)'}}, h(F.Icon, {name:n, size:24})), n);
})));
</script>
</body>
</html>
