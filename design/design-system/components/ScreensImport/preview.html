<!-- @dsCard group="Screens" height=900 width=2610 page subtitle="Add recipe, Import preview with a blocking allergen notice, Clarification prompt, Your version with source nutrition, Target missed, I don't have this" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Add and import a recipe</title></head>
<body>
<div id="root"></div>
<script>
var F = window.FitMeal, h = React.createElement;
function root(el){ ReactDOM.createRoot(document.getElementById('root')).render(el); }
function Ph(caption, content, footer, theme){ return h(F.PhoneFrame, {caption:caption, footer:footer, theme:theme}, content); }
function show(list){ root(h.apply(null, ['div', {className:'fm-showcase'}].concat(list))); }
function scroll(){ return h.apply(null, ['div', {className:'fm-screen-scroll'}].concat([].slice.call(arguments))); }
function cta(label, extra, disabled){ return h('div', {className:'fm-sticky'}, extra || null, h(F.Button, {variant:'primary', size:'lg', block:true, disabled:!!disabled}, label)); }
function q(title, sub){ return h('div', {style:{display:'flex', flexDirection:'column', gap:8, paddingTop:8}}, h('h1', {className:'fm-hxl', style:{fontSize:30, lineHeight:'34px'}}, title), sub ? h('p', {className:'fm-callout'}, sub) : null); }
function card(){ return h.apply(null, ['div', {style:{background:'var(--surface-raised)', border:'1px solid var(--line)', borderRadius:'var(--radius-lg)', padding:16, display:'flex', flexDirection:'column', gap:12}}].concat([].slice.call(arguments))); }
function row(label, value, icon, danger){ return h('div', {style:{display:'flex', alignItems:'center', gap:12, padding:'12px 16px', borderBottom:'1px solid var(--line)', background:'var(--surface-raised)'}},
  icon ? h('span', {style:{color: danger ? 'var(--danger)' : 'var(--ink-muted)'}}, h(F.Icon, {name:icon, size:20})) : null,
  h('span', {style:{flex:1, font:'500 16px/22px var(--font-text)', color: danger ? 'var(--danger)' : 'var(--ink)'}}, label),
  value ? h('span', {style:{font:'500 15px/20px var(--font-text)', color:'var(--ink-muted)'}}, value) : null,
  h('span', {style:{color:'var(--ink-faint)'}}, h(F.Icon, {name:'chevron-right', size:18}))); }
function label(t){ return h('span', {className:'fm-cap'}, t); }
function sheet(){ return h('div', {key:'s', className:'fm-scrim'}, h.apply(null, ['div', {className:'fm-sheet'}, h('span', {className:'fm-sheet-grab'})].concat([].slice.call(arguments)))); }
function sheetHead(title){ return h('div', {style:{display:'flex', justifyContent:'space-between', alignItems:'center'}}, h('h2', {className:'fm-h2'}, title), h(F.IconButton, {icon:'close', label:'Close'})); }
var AV = h(F.Avatar, {initials:'OL', label:'Profile'});
var PREP = {portion:'1/2', cook:'Wed', eatBy:'Thu'};
var TODAY_MEALS = [
  h(F.MealCard, {key:1, slot:'Breakfast', time:'08:00', title:'Protein Snickers Shake', kcal:520, protein:44, carbs:52, fat:14, status:'eaten', badges:[{label:'Prepare fresh', icon:'clock'}]}),
  h(F.MealCard, {key:2, slot:'Lunch', time:'13:30', title:'Chicken Teriyaki', kcal:548, protein:49, carbs:58, fat:12, status:'cooked', prep:PREP}),
  h(F.MealCard, {key:3, slot:'Dinner', time:'19:00', title:'Turkey Pasta Bake', kcal:429, protein:32, carbs:40, fat:14, prep:PREP})
];
function daySummary(){ return card(
  h('div', {style:{display:'flex', alignItems:'center', gap:16}},
    h(F.MacroRing, {value:1497, target:1500, size:112, stroke:10, macros:{protein:{share:.32}, carbs:{share:.35}, fat:{share:.33}}}),
    h('div', {style:{flex:1, display:'flex', flexDirection:'column', gap:10}},
      h(F.MacroBar, {macro:'protein', value:125, target:115, mode:'min', compact:true}),
      h(F.MacroBar, {macro:'carbs', value:150, target:140, compact:true}),
      h(F.MacroBar, {macro:'fat', value:40, target:50, compact:true})))); }
var UP_NEXT = h(F.BottomAccessory, {icon:'clock', title:'Up next · Dinner 19:00', subtitle:'Turkey Pasta Bake · meal prep 1/2', action:'Eat'});
show([
 Ph('25 Add recipe', [
   h(F.NavBar, {key:'n', large:true, title:'Add a recipe', subtitle:'From Instagram, TikTok, a blog, a PDF or your notes.'}),
   scroll(
     h(F.NumberField, {label:'Paste a link', value:'', placeholder:'https://…'}),
     h('div', {className:'fm-stack', style:{gap:8}},
       h(F.SelectCard, {icon:'link', title:'Paste link', description:'Recipe pages, Instagram and TikTok captions', meta:'2 of 3 left'}),
       h(F.SelectCard, {icon:'doc', title:'Upload PDF', description:'E-books and plans from your dietitian', meta:'1 trial'}),
       h(F.SelectCard, {icon:'text', title:'Paste text', description:'Copy a recipe from anywhere'}),
       h(F.SelectCard, {icon:'edit', title:'Enter manually', description:'Type ingredients line by line'})),
     h('p', {className:'fm-foot'}, 'Tip: in Instagram, tap Share → FitMeal. Imports stay private to you.')),
   h(F.TabBar, {key:'t', active:'none'})
 ]),
 Ph('26 Import preview · allergen', [
   h(F.NavBar, {key:'n', back:'Cancel', title:'Check ingredients'}),
   scroll(
     h(F.Notice, {tone:'danger', title:'Contains peanuts (peanut butter)', body:'Peanuts are your allergy. You can save this recipe, but we can’t personalize or plan it until peanut butter is swapped or removed.', actions:[{label:'Swap peanut butter', icon:'swap'}, {label:'Remove it'}]}),
     h('div', {className:'fm-stack', style:{gap:2}}, label('Recipe detected'), h('h1', {className:'fm-h2'}, 'Satay Chicken Wrap'), h('p', {className:'fm-foot'}, 'from instagram.com · serves 2 · 20 min')),
     h('div', {className:'fm-group'},
       h(F.IngredientRow, {name:'Peanut butter', amount:'2 tbsp · 32 g', excluded:'Allergy · peanuts', swappable:false}),
       h(F.IngredientRow, {name:'Chicken breast', amount:'300 g', swappable:false}),
       h(F.IngredientRow, {name:'Cheese?', amount:'1 cup · check this', swappable:false}))),
   h('div', {key:'c'}, cta('Continue', h('p', {className:'fm-foot', style:{textAlign:'center'}}, '1 allergen to fix · 1 item to check')))
 ]),
 Ph('27 Clarification prompt', [
   h(F.NavBar, {key:'n', back:'Cancel', title:'Check ingredients'}),
   scroll(h('h1', {className:'fm-h2'}, 'Satay Chicken Wrap')),
   sheet(sheetHead('Quick check'),
     h(F.ConfidencePrompt, {raw:'1 cup cheese', question:'Which cheese?', options:['Mozzarella','Cheddar','Gouda','Other']}),
     h('p', {className:'fm-foot'}, 'We don’t guess. An unclear ingredient counts as possibly containing your allergens until you choose.'),
     h(F.Button, {variant:'primary', size:'lg', block:true, disabled:true}, 'Confirm'))
 ]),
 Ph('28 Your version', [
   h(F.NavBar, {key:'n', back:'Ingredients', title:''}),
   scroll(
     h('h1', {className:'fm-h2'}, 'Satay-style Chicken Wrap'),
     h(F.CompareCard, {original:{kcal:612, protein:29}, sourceKcal:540, yours:{kcal:548, protein:49}, target:'Your lunch: 555 kcal · 45+ g protein'}),
     h(F.SectionHeader, {title:'What changed', meta:'3 changes'}),
     h('ul', {className:'fm-changes'},
       h(F.ChangeItem, {what:'Peanut butter → sunflower seed butter', effect:'safe for your peanut allergy', icon:'swap'}),
       h(F.ChangeItem, {what:'Increased chicken by 60 g', effect:'adds 14 g protein', icon:'plus'}),
       h(F.ChangeItem, {what:'Mozzarella 100 g → 60 g', effect:'saves 112 kcal', icon:'minus'}))),
   h('div', {key:'c', className:'fm-sticky'}, h(F.Button, {variant:'primary', size:'lg', block:true}, 'Add to this week'), h(F.Button, {variant:'quiet', size:'md', block:true}, 'Save to my recipes'))
 ]),
 Ph('29 Target missed', [
   h(F.NavBar, {key:'n', back:'Ingredients', title:''}),
   scroll(
     h('h1', {className:'fm-h2'}, 'Butter Chickpea Curry'),
     h(F.CompareCard, {missed:'Protein 41 g — 4 g under your 45 g minimum', original:{kcal:690, protein:22}, yours:{kcal:552, protein:41}, target:'Your lunch: 555 kcal · 45+ g protein'}),
     h(F.Notice, {tone:'warning', title:'We can’t reach your protein minimum with this dish', body:'More chickpeas or tofu would change it too much. Choose what to do:', actions:[{label:'Keep it as is'}, {label:'Pick another recipe'}]}),
     h('div', {className:'fm-group'}, row('Give lunch more of the day', '36% → 40%', 'target'))),
   h('div', {key:'x'})
 ]),
 Ph('30 I don’t have this', [
   h(F.NavBar, {key:'n', back:'Recipe', title:''}),
   sheet(
     label('Missing'),
     h('h2', {className:'fm-h2'}, 'Broccoli 200 g'),
     card(
       h('span', {className:'fm-cap', style:{color:'var(--basil-ink)'}}, 'Use instead'),
       h('p', {className:'fm-h3'}, 'Zucchini 220 g'),
       h(F.Delta, {items:[{value:7, unit:'kcal'},{value:-1, unit:'g', letter:'P'}]})),
     h('p', {className:'fm-foot'}, 'Nothing changes until you confirm. If your day moves off target, we’ll propose a rebalance for you to check.'),
     h(F.Button, {variant:'primary', size:'lg', block:true}, 'Use zucchini'),
     h(F.Button, {variant:'quiet', size:'md', block:true}, 'See other options'))
 ])
]);
</script>
</body>
</html>
