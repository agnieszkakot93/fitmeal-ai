# Production stack for a single 2 vCPU / 4 GB VPS (Development Plan D4, §6.4).
#   docker compose --env-file infra/.env.prod -f infra/docker-compose.prod.yml up -d
# See docs/ops/DEPLOY.md. Only Caddy publishes ports; Postgres and Redis are reachable
# only on the `backend` network. Default-on memory limits sum to ~2.5 GB.
name: donut-prod

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "5"}

x-app: &app
  <<: *hardening
  image: ${DONUT_IMAGE:?set DONUT_IMAGE}
  user: "1000:1000"
  read_only: true
  tmpfs: ["/tmp:size=64m"]
  cap_drop: [ALL]
  environment:
    DONUT_ENV: ${DONUT_ENV:-prod}
    DONUT_DATABASE_URL: ${DONUT_DATABASE_URL:?set DONUT_DATABASE_URL} POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
    DONUT_REDIS_URL: ${DONUT_REDIS_URL:?set DONUT_REDIS_URL} REDIS_PASSWORD}@redis:6379/0
    DONUT_JWT_SECRET: ${DONUT_JWT_SECRET:?set DONUT_JWT_SECRET}
    DONUT_IMPORT_BLOCKED_DOMAINS: ${DONUT_IMPORT_BLOCKED_DOMAINS:-[]}
    DONUT_APPLE_CLIENT_IDS: ${DONUT_APPLE_CLIENT_IDS:-[]}
  networks: [backend]

services:
  caddy:
    <<: *hardening
    image: caddy:2.8-alpine
    # Runs as the image's root user only so it can own its data volume; every
    # capability except NET_BIND_SERVICE is dropped and the root FS is read-only.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DONUT_API_DOMAIN: ${DONUT_API_DOMAIN:?set DONUT_API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: {condition: service_healthy}
    networks: [backend]
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M}

  # One-shot: applies Alembic migrations and exits; api starts only if it succeeds.
  migrate:
    <<: *app
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: {condition: service_healthy}
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 512M}

  api:
    <<: *app
    # --no-access-log: Caddy writes the (query-stripped) access log; health data
    # must never reach logs (D8).
    command:
      - sh
      - -c
      - exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers "$${API_WORKERS:-2}" --proxy-headers --forwarded-allow-ips '*' --no-access-log --no-server-header
    environment:
      DONUT_ENV: ${DONUT_ENV:-prod}
      DONUT_DATABASE_URL: ${DONUT_DATABASE_URL:?set DONUT_DATABASE_URL} POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
      DONUT_REDIS_URL: ${DONUT_REDIS_URL:?set DONUT_REDIS_URL} REDIS_PASSWORD}@redis:6379/0
      DONUT_JWT_SECRET: ${DONUT_JWT_SECRET:?set DONUT_JWT_SECRET}
      DONUT_IMPORT_BLOCKED_DOMAINS: ${DONUT_IMPORT_BLOCKED_DOMAINS:-[]}
      DONUT_APPLE_CLIENT_IDS: ${DONUT_APPLE_CLIENT_IDS:-[]}
      API_WORKERS: ${API_WORKERS:-2}
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status != 200)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      migrate: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    deploy:
      resources:
        limits: {cpus: "1.5", memory: 1G}

  # arq worker: recipe imports (Development Plan §2.1). It fetches user-supplied links
  # through the SSRF guard in app/imports/fetch.py. It stays behind the `worker` profile
  # until its egress backstop (firewall rules or an egress proxy blocking private
  # ranges, §7.7) is in place; then drop the profile.
  worker:
    <<: *app
    profiles: [worker]
    command: ["arq", "app.importjobs.worker.WorkerSettings"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 512M}

  postgres:
    <<: *hardening
    image: postgres:16
    # the entrypoint starts as root, fixes data-dir ownership, then drops to `postgres`
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "effective_cache_size=768MB", "-c", "max_connections=60"]
    shm_size: 128m
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]
    deploy:
      resources:
        limits: {cpus: "1.5", memory: 1G}

  redis:
    <<: *hardening
    image: redis:7-alpine
    read_only: true
    # the entrypoint drops to the `redis` user before starting the server
    command:
      - sh
      - -c
      - exec docker-entrypoint.sh redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 192mb --maxmemory-policy noeviction --appendonly yes
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M}

  # Nightly encrypted pg_dump to R2. Not long-running: a host systemd timer runs
  # `docker compose ... run --rm backup` (docs/ops/BACKUPS.md).
  backup:
    <<: *hardening
    restart: "no"
    profiles: [backup]
    build: {context: ./backup}
    image: donut-backup:local
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    cap_drop: [ALL]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:?set POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:?set POSTGRES_DB}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_BUCKET: ${R2_BUCKET:-}
      AWS_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      BACKUP_PREFIX: ${BACKUP_PREFIX:-postgres}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
    command: ["backup.sh"]
    depends_on:
      postgres: {condition: service_healthy}
    networks: [backend]
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 512M}

networks:
  # Not `internal: true`: the api needs egress for link import and Apple JWKS, and
  # the backup job for R2. Nothing on it is published except Caddy's 80/443.
  backend: {}

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
