# Local development stack.
#   docker compose -f infra/docker-compose.yml up --build
# API: http://localhost:8000/docs
# Postgres and Redis listen on 127.0.0.1 only. Optional overrides go in
# infra/.env (see infra/.env.example).
name: donut

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: donut
      POSTGRES_PASSWORD: donut
      POSTGRES_DB: donut
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U donut -d donut"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-donut}"]
    ports: ["127.0.0.1:6379:6379"]

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      DONUT_DATABASE_URL: postgresql+asyncpg://donut:donut@postgres:5432/donut
      DONUT_REDIS_URL: redis://:${REDIS_PASSWORD:-donut}@redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}
    # live reload: mount the code, keep the image's virtualenv
    volumes:
      - ../backend/app:/app/backend/app
      - ../backend/alembic:/app/backend/alembic
      - ../data:/app/data
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  pgdata:
