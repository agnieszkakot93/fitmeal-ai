name: backend-image

# Builds the production API image. Pushes to GHCR only on develop/main; PRs just build.
on:
  push:
    branches: [develop, main]
    paths: ["backend/**", "data/**", ".dockerignore", ".github/workflows/backend-image.yml"]
  pull_request:
    paths: ["backend/**", "data/**", ".dockerignore", ".github/workflows/backend-image.yml"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository_owner }}/donut-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
