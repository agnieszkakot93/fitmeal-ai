name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", "data/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "data/**", ".github/workflows/backend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fitmeal
          POSTGRES_PASSWORD: fitmeal
          POSTGRES_DB: fitmeal_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fitmeal"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      FITMEAL_TEST_DATABASE_URL: postgresql+asyncpg://fitmeal:fitmeal@localhost:5432/fitmeal_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app tests
      - run: uv run pytest
      - name: Models and migrations are in sync
        run: uv run alembic check
        env:
          FITMEAL_DATABASE_URL: postgresql+asyncpg://fitmeal:fitmeal@localhost:5432/fitmeal_test
