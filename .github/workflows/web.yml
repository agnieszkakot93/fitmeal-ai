name: web

on:
  push:
    branches: [main, develop]
    paths:
      - "web/**"
      - "design/design-system/**"
      - "backend/app/**"
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - "design/design-system/**"
      - "backend/app/**"
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - ".github/workflows/web.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  # The committed spec and generated client must match the backend's OpenAPI.
  api-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm api:generate
      - name: Generated client is up to date
        run: git diff --exit-code -- openapi.json src/api/schema.d.ts || { echo "::error::Run 'pnpm api:generate' in web/ and commit the result."; exit 1; }
