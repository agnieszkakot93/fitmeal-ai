# Donut — recipe catalog
#
# Recipes Donut owns: own text in Polish and English, public in the app.
# Imported recipes never land here (PRD §8.1).
#
# Ingredients name a food slug from data/foods/curated.yaml, an amount and a
# unit (default g). The importer converts each amount to grams with the
# food's portion weights or density and computes nutrition from that;
# nutrition is never typed here. `role` defaults to the food's first
# culinary role.
#
# `review` works as in curated.yaml: only a named human sets `verified`,
# after cooking or checking the recipe.
#
# Tags: breakfast, lunch, dinner, snack, dessert, starter, side, soup · high_protein, vegetarian,
# vegan · quick (≤ 20 min total), meal_prep, polish.

recipes:

  # ── Breakfast ─────────────────────────────────────────────────────────────
  - slug: protein-oatmeal-berries
    title: {en: "Protein oatmeal with berries", pl: "Owsianka proteinowa z owocami jagodowymi"}
    servings: 1
    prep_minutes: 3
    cook_minutes: 5
    difficulty: easy
    tags: [breakfast, high_protein, vegetarian, quick]
    equipment: [pot]
    storage: {fridge_days: 1}
    meal_prep_score: 40
    ingredients:
      - {food: oats-rolled, amount: 50}
      - {food: milk-skim, amount: 200, unit: ml}
      - {food: whey-protein-isolate, amount: 1, unit: scoop}
      - {food: blueberries, amount: 1, unit: handful}
      - {food: raspberries, amount: 1, unit: handful}
      - {food: cinnamon, amount: 1, unit: pinch}
    steps:
      en:
        - Simmer the oats in the milk for 4–5 minutes, stirring, until creamy.
        - Take off the heat, let it cool for a minute and stir in the protein powder.
        - Top with the berries and a pinch of cinnamon.
      pl:
        - Gotuj płatki owsiane w mleku 4–5 minut, mieszając, aż zgęstnieją.
        - Zdejmij z ognia, odczekaj minutę i wmieszaj odżywkę białkową.
        - Posyp owocami i szczyptą cynamonu.

  - slug: overnight-oats-apple-cinnamon
    title: {en: "Apple cinnamon overnight oats", pl: "Owsianka na zimno z jabłkiem i cynamonem"}
    servings: 1
    prep_minutes: 5
    cook_minutes: 0
    difficulty: easy
    tags: [breakfast, vegetarian, meal_prep, quick]
    equipment: [jar]
    storage: {fridge_days: 3}
    meal_prep_score: 90
    ingredients:
      - {food: oats-rolled, amount: 50}
      - {food: greek-yogurt-nonfat, amount: 150}
      - {food: milk-skim, amount: 80, unit: ml}
      - {food: chia-seeds, amount: 1, unit: tsp}
      - {food: apple, amount: 0.5, unit: piece}
      - {food: walnuts, amount: 10}
      - {food: cinnamon, amount: 0.5, unit: tsp}
    steps:
      en:
        - Mix the oats, yogurt, milk, chia seeds and cinnamon in a jar.
        - Grate in the apple, stir, close and refrigerate overnight.
        - Top with chopped walnuts before eating.
      pl:
        - W słoiku wymieszaj płatki, jogurt, mleko, nasiona chia i cynamon.
        - Zetrzyj jabłko, wymieszaj, zamknij i odstaw na noc do lodówki.
        - Przed jedzeniem posyp posiekanymi orzechami włoskimi.

  - slug: veggie-scrambled-eggs
    title: {en: "Scrambled eggs with peppers and spinach", pl: "Jajecznica z papryką i szpinakiem"}
    servings: 1
    prep_minutes: 5
    cook_minutes: 6
    difficulty: easy
    tags: [breakfast, vegetarian, quick]
    equipment: [pan]
    storage: {fridge_days: 0}
    meal_prep_score: 10
    ingredients:
      - {food: egg-whole-raw, amount: 3, unit: piece}
      - {food: bell-pepper-red, amount: 0.5, unit: piece}
      - {food: spinach, amount: 1, unit: handful}
      - {food: butter, amount: 1, unit: tsp}
      - {food: chives, amount: 1, unit: tbsp}
      - {food: salt, amount: 1, unit: pinch}
      - {food: black-pepper, amount: 1, unit: pinch}
      - {food: bread-rye, amount: 1, unit: slice}
    steps:
      en:
        - Dice the pepper and soften it in the butter for 3 minutes.
        - Add the spinach and let it wilt.
        - Pour in the beaten eggs, season and stir gently until just set.
        - Sprinkle with chives and serve with the rye bread.
      pl:
        - Pokrój paprykę w kostkę i podsmaż na maśle 3 minuty.
        - Dodaj szpinak i poczekaj, aż zwiędnie.
        - Wlej roztrzepane jajka, dopraw i delikatnie mieszaj, aż się zetną.
        - Posyp szczypiorkiem i podawaj z chlebem żytnim.

  - slug: cottage-cheese-radish-toast
    title: {en: "Cottage cheese toast with radishes", pl: "Kanapki z serkiem wiejskim i rzodkiewką"}
    servings: 1
    prep_minutes: 5
    cook_minutes: 0
    difficulty: easy
    tags: [breakfast, high_protein, vegetarian, quick, polish]
    equipment: []
    storage: {fridge_days: 0}
    meal_prep_score: 10
    ingredients:
      - {food: bread-wholewheat, amount: 2, unit: slice}
      - {food: cottage-cheese-lowfat, amount: 150}
      - {food: radish, amount: 5, unit: piece}
      - {food: chives, amount: 1, unit: tbsp}
      - {food: black-pepper, amount: 1, unit: pinch}
    steps:
      en:
        - Slice the radishes thinly and chop the chives.
        - Spread the cottage cheese on the bread.
        - Top with radishes and chives and season with pepper.
      pl:
        - Pokrój rzodkiewki w cienkie plasterki i posiekaj szczypiorek.
        - Rozłóż serek wiejski na chlebie.
        - Ułóż rzodkiewkę, posyp szczypiorkiem i dopraw pieprzem.

  - slug: banana-oat-pancakes
    title: {en: "Banana oat pancakes", pl: "Placuszki owsiane z bananem"}
    servings: 2
    prep_minutes: 5
    cook_minutes: 12
    difficulty: easy
    tags: [breakfast, vegetarian]
    equipment: [blender, pan]
    storage: {fridge_days: 2, freezer_friendly: true}
    meal_prep_score: 60
    ingredients:
      - {food: oats-rolled, amount: 80}
      - {food: banana, amount: 1, unit: piece}
      - {food: egg-whole-raw, amount: 2, unit: piece}
      - {food: milk-skim, amount: 100, unit: ml}
      - {food: baking-powder, amount: 1, unit: tsp}
      - {food: rapeseed-oil, amount: 1, unit: tsp}
      - {food: greek-yogurt-nonfat, amount: 100}
      - {food: strawberries, amount: 1, unit: handful}
    steps:
      en:
        - Blend the oats, banana, eggs, milk and baking powder into a thick batter.
        - Brush a pan with oil and fry small pancakes for 2 minutes per side.
        - Serve with the yogurt and sliced strawberries.
      pl:
        - Zmiksuj płatki, banana, jajka, mleko i proszek do pieczenia na gęste ciasto.
        - Posmaruj patelnię olejem i smaż małe placuszki po 2 minuty z każdej strony.
        - Podawaj z jogurtem i pokrojonymi truskawkami.

  - slug: greek-yogurt-bowl-nuts
    title: {en: "Greek yogurt bowl with fruit and nuts", pl: "Miska jogurtu greckiego z owocami i orzechami"}
    servings: 1
    prep_minutes: 4
    cook_minutes: 0
    difficulty: easy
    tags: [breakfast, high_protein, vegetarian, quick]
    equipment: []
    storage: {fridge_days: 0}
    meal_prep_score: 20
    ingredients:
      - {food: greek-yogurt-nonfat, amount: 250}
      - {food: kiwi, amount: 1, unit: piece}
      - {food: blueberries, amount: 1, unit: handful}
      - {food: almonds, amount: 15}
      - {food: honey, amount: 1, unit: tsp}
    steps:
      en:
        - Spoon the yogurt into a bowl.
        - Top with the sliced kiwi, blueberries and roughly chopped almonds.
        - Drizzle with honey.
      pl:
        - Przełóż jogurt do miski.
        - Ułóż pokrojone kiwi, borówki i grubo posiekane migdały.
        - Polej miodem.

  - slug: shakshuka
    title: {en: "Shakshuka", pl: "Szakszuka"}
    servings: 2
    prep_minutes: 8
    cook_minutes: 15
    difficulty: easy
    tags: [breakfast, vegetarian]
    equipment: [pan]
    storage: {fridge_days: 0}
    meal_prep_score: 20
    ingredients:
      - {food: olive-oil, amount: 1, unit: tbsp}
      - {food: onion, amount: 1, unit: piece}
      - {food: bell-pepper-red, amount: 1, unit: piece}
      - {food: garlic, amount: 2, unit: clove}
      - {food: tomatoes-canned, amount: 1, unit: can}
      - {food: cumin, amount: 0.5, unit: tsp}
      - {food: paprika-sweet, amount: 1, unit: tsp}
      - {food: egg-whole-raw, amount: 4, unit: piece}
      - {food: parsley, amount: 1, unit: tbsp}
      - {food: salt, amount: 2, unit: pinch}
      - {food: bread-wholewheat, amount: 2, unit: slice}
    steps:
      en:
        - Fry the chopped onion and pepper in the oil for 5 minutes, add the garlic and spices.
        - Add the tomatoes, season and simmer for 5 minutes until slightly thick.
        - Make four wells, crack in the eggs, cover and cook for 5–6 minutes until the whites set.
        - Sprinkle with parsley and serve with the bread.
      pl:
        - Podsmaż posiekaną cebulę i paprykę na oliwie przez 5 minut, dodaj czosnek i przyprawy.
        - Dodaj pomidory, dopraw i duś 5 minut, aż lekko zgęstnieją.
        - Zrób cztery wgłębienia, wbij jajka, przykryj i gotuj 5–6 minut, aż białka się zetną.
        - Posyp natką pietruszki i podawaj z chlebem.

  - slug: protein-smoothie-banana-pb
    title: {en: "Banana peanut butter protein smoothie", pl: "Koktajl proteinowy z bananem i masłem orzechowym"}
    servings: 1
    prep_minutes: 3
    cook_minutes: 0
    difficulty: easy
    tags: [breakfast, snack, high_protein, vegetarian, quick]
    equipment: [blender]
    storage: {fridge_days: 0}
    meal_prep_score: 10
    ingredients:
      - {food: banana, amount: 1, unit: piece}
      - {food: milk-skim, amount: 250, unit: ml}
      - {food: whey-protein-isolate, amount: 1, unit: scoop}
      - {food: peanut-butter, amount: 1, unit: tbsp}
      - {food: oats-rolled, amount: 2, unit: tbsp}
    steps:
      en:
        - Put everything in a blender.
        - Blend until smooth and drink straight away.
      pl:
        - Włóż wszystkie składniki do blendera.
        - Zmiksuj na gładko i wypij od razu.

  - slug: tofu-scramble
    title: {en: "Tofu scramble with vegetables", pl: "Tofucznica z warzywami"}
    servings: 1
    prep_minutes: 5
    cook_minutes: 8
    difficulty: easy
    tags: [breakfast, vegan, high_protein, quick]
    equipment: [pan]
    storage: {fridge_days: 2}
    meal_prep_score: 40
    ingredients:
      - {food: tofu-firm, amount: 180}
      - {food: rapeseed-oil, amount: 1, unit: tsp}
      - {food: onion, amount: 0.5, unit: piece}
      - {food: cherry-tomatoes, amount: 6, unit: piece}
      - {food: spinach, amount: 1, unit: handful}
      - {food: turmeric, amount: 0.5, unit: tsp}
      - {food: soy-sauce, amount: 1, unit: tsp}
      - {food: black-pepper, amount: 1, unit: pinch}
    steps:
      en:
        - Fry the chopped onion in the oil for 3 minutes.
        - Crumble in the tofu, add the turmeric and soy sauce and fry for 3 minutes.
        - Add the halved tomatoes and spinach and cook until the spinach wilts. Season with pepper.
      pl:
        - Podsmaż posiekaną cebulę na oleju przez 3 minuty.
        - Rozkrusz tofu, dodaj kurkumę i sos sojowy i smaż 3 minuty.
        - Dodaj przekrojone pomidorki i szpinak, smaż, aż szpinak zwiędnie. Dopraw pieprzem.

  - slug: buckwheat-porridge-plums
    title: {en: "Buckwheat porridge with plums", pl: "Kasza gryczana na mleku ze śliwkami"}
    servings: 1
    prep_minutes: 3
    cook_minutes: 15
    difficulty: easy
    tags: [breakfast, vegetarian, polish]
    equipment: [pot]
    storage: {fridge_days: 2}
    meal_prep_score: 60
    ingredients:
      - {food: buckwheat-groats, amount: 50}
      - {food: milk-2, amount: 200, unit: ml}
      - {food: plums, amount: 3, unit: piece}
      - {food: honey, amount: 1, unit: tsp}
      - {food: cinnamon, amount: 1, unit: pinch}
    steps:
      en:
        - Rinse the buckwheat and simmer it in the milk, covered, for 12–15 minutes.
        - Halve and stone the plums and add them for the last 3 minutes.
        - Sweeten with honey and dust with cinnamon.
      pl:
        - Przepłucz kaszę i gotuj ją pod przykryciem w mleku 12–15 minut.
        - Przekrój śliwki, usuń pestki i dodaj na ostatnie 3 minuty.
        - Osłódź miodem i oprósz cynamonem.

  - slug: egg-muffins-ham-veg
    title: {en: "Egg muffins with ham and vegetables", pl: "Muffinki jajeczne z szynką i warzywami"}
    servings: 2
    prep_minutes: 10
    cook_minutes: 20
    difficulty: easy
    tags: [breakfast, high_protein, meal_prep]
    equipment: [oven, muffin_tin]
    storage: {fridge_days: 4, freezer_friendly: true}
    meal_prep_score: 90
    ingredients:
      - {food: egg-whole-raw, amount: 6, unit: piece}
      - {food: ham-deli-lean, amount: 6, unit: slice}
      - {food: bell-pepper-red, amount: 1, unit: piece}
      - {food: spring-onion, amount: 2, unit: piece}
      - {food: spinach, amount: 1, unit: handful}
      - {food: mozzarella-part-skim, amount: 40}
      - {food: salt, amount: 2, unit: pinch}
      - {food: black-pepper, amount: 1, unit: pinch}
    steps:
      en:
        - Heat the oven to 180°C and line or grease a 12-hole muffin tin.
        - Chop the ham, pepper, spring onion and spinach and divide between the holes.
        - Beat the eggs with the salt and pepper, pour over and top with the grated mozzarella.
        - Bake for 18–20 minutes until set. Cool before storing.
      pl:
        - Rozgrzej piekarnik do 180°C i wyłóż lub natłuść formę na 12 muffinek.
        - Posiekaj szynkę, paprykę, dymkę i szpinak i rozłóż do foremek.
        - Roztrzep jajka z solą i pieprzem, zalej warzywa i posyp startą mozzarellą.
        - Piecz 18–20 minut, aż się zetną. Przed schowaniem ostudź.

  - slug: chia-pudding-mango
    title: {en: "Chia pudding with mango", pl: "Pudding chia z mango"}
    servings: 2
    prep_minutes: 5
    cook_minutes: 0
    difficulty: easy
    tags: [breakfast, vegan, meal_prep]
    equipment: [jar]
    storage: {fridge_days: 3}
    meal_prep_score: 85
    ingredients:
      - {food: chia-seeds, amount: 50}
      - {food: soy-drink, amount: 300, unit: ml}
      - {food: maple-syrup, amount: 1, unit: tbsp}
      - {food: mango, amount: 1, unit: piece}
      - {food: pumpkin-seeds, amount: 1, unit: tbsp}
    steps:
      en:
        - Stir the chia seeds into the soy drink and maple syrup; stir again after 10 minutes.
        - Refrigerate for at least 3 hours or overnight.
        - Top with the diced mango and pumpkin seeds.
      pl:
        - Wymieszaj nasiona chia z napojem sojowym i syropem klonowym; po 10 minutach zamieszaj ponownie.
        - Wstaw do lodówki na co najmniej 3 godziny lub na noc.
        - Podawaj z mango pokrojonym w kostkę i pestkami dyni.

  - slug: avocado-egg-toast
    title: {en: "Avocado toast with egg", pl: "Tost z awokado i jajkiem"}
    servings: 1
    prep_minutes: 5
    cook_minutes: 8
    difficulty: easy
    tags: [breakfast, vegetarian, quick]
    equipment: [pot]
    storage: {fridge_days: 0}
    meal_prep_score: 5
    ingredients:
      - {food: bread-wholewheat, amount: 2, unit: slice}
      - {food: avocado, amount: 0.5, unit: piece}
      - {food: egg-whole-raw, amount: 2, unit: piece}
      - {food: lemon-juice, amount: 1, unit: tsp}
      - {food: chili-pepper, amount: 0.25, unit: piece, optional: true}
      - {food: salt, amount: 1, unit: pinch}
    steps:
      en:
        - Boil the eggs for 7 minutes, cool in cold water and peel.
        - Toast the bread. Mash the avocado with the lemon juice and salt.
        - Spread the avocado on the toast, top with the halved eggs and sliced chili if using.
      pl:
        - Gotuj jajka 7 minut, schłodź w zimnej wodzie i obierz.
        - Opiecz chleb. Rozgnieć awokado z sokiem z cytryny i solą.
        - Rozsmaruj awokado na tostach, ułóż połówki jajek i plasterki chili, jeśli używasz.

  - slug: semolina-pudding-raspberries
    title: {en: "Semolina pudding with raspberries", pl: "Kaszka manna z malinami"}
    servings: 1
    prep_minutes: 2
    cook_minutes: 6
    difficulty: easy
    tags: [breakfast, vegetarian, quick, polish]
    equipment: [pot]
    storage: {fridge_days: 1}
    meal_prep_score: 30
    ingredients:
      - {food: semolina-dry, amount: 40}
      - {food: milk-2, amount: 250, unit: ml}
      - {food: whey-protein-isolate, amount: 0.5, unit: scoop, optional: true}
      - {food: raspberries, amount: 2, unit: handful}
      - {food: honey, amount: 1, unit: tsp}
    steps:
      en:
        - Bring the milk to a simmer and whisk in the semolina in a thin stream.
        - Cook for 3–4 minutes, stirring, until thick. Stir in the protein powder off the heat if using.
        - Serve with the raspberries and honey.
      pl:
        - Zagotuj mleko i cienkim strumieniem wsyp kaszę, mieszając trzepaczką.
        - Gotuj 3–4 minuty, mieszając, aż zgęstnieje. Poza ogniem wmieszaj odżywkę, jeśli używasz.
        - Podawaj z malinami i miodem.

  - slug: turkey-ham-sandwich-veg
    title: {en: "Rye sandwich with turkey ham and vegetables", pl: "Kanapki żytnie z szynką i warzywami"}
    servings: 1
    prep_minutes: 5
    cook_minutes: 0
    difficulty: easy
    tags: [breakfast, quick, polish]
    equipment: []
    storage: {fridge_days: 1}
    meal_prep_score: 40
    ingredients:
      - {food: bread-rye, amount: 2, unit: slice}
      - {food: cream-cheese, amount: 1, unit: tbsp}
      - {food: ham-deli-lean, amount: 4, unit: slice}
      - {food: tomato, amount: 1, unit: piece}
      - {food: cucumber, amount: 0.25, unit: piece}
      - {food: butterhead-lettuce, amount: 1, unit: handful}
    steps:
      en:
        - Spread the bread thinly with the cream cheese.
        - Layer the lettuce, ham and sliced tomato and cucumber.
      pl:
        - Posmaruj chleb cienko serkiem.
        - Ułóż sałatę, szynkę oraz plasterki pomidora i ogórka.

  # ── Lunch & dinner: poultry ───────────────────────────────────────────────
  - slug: chicken-rice-broccoli-bowl
    title: {en: "Chicken, rice and broccoli bowl", pl: "Miska z kurczakiem, ryżem i brokułami"}
    servings: 2
    prep_minutes: 10
    cook_minutes: 20
    difficulty: easy
    tags: [lunch, dinner, high_protein, meal_prep]
    equipment: [pot, pan]
    storage: {fridge_days: 3}
    meal_prep_score: 95
    ingredients:
      - {food: chicken-breast-raw, amount: 300}
      - {food: rice-white-dry, amount: 120}
      - {food: broccoli, amount: 300}
      - {food: olive-oil, amount: 1, unit: tbsp}
      - {food: garlic, amount: 2, unit: clove}
      - {food: soy-sauce, amount: 2, unit: tbsp}
      - {food: sesame-seeds, amount: 1, unit: tsp}
      - {food: paprika-sweet, amount: 1, unit: tsp}
    steps:
      en:
        - Cook the rice according to the packet. Steam the broccoli florets for 5 minutes.
        - Cut the chicken into strips, rub with paprika and fry in the oil for 6–7 minutes until cooked through.
        - Add the garlic and soy sauce for the last minute.
        - Divide the rice, broccoli and chicken between two bowls and sprinkle with sesame.
      pl:
        - Ugotuj ryż według przepisu na opakowaniu. Różyczki brokuła gotuj na parze 5 minut.
        - Pokrój kurczaka w paski, natrzyj papryką i smaż na oliwie 6–7 minut, aż będzie upieczony w środku.
        - Na ostatnią minutę dodaj czosnek i sos sojowy.
        - Rozłóż ryż, brokuły i kurczaka do dwóch misek i posyp sezamem.

  - slug: chicken-curry-coconut
    title: {en: "Light chicken curry", pl: "Lekkie curry z kurczakiem"}
    servings: 4
    prep_minutes: 15
    cook_minutes: 25
    difficulty: medium
    tags: [lunch, dinner, high_protein, meal_prep]
    equipment: [pot]
    storage: {fridge_days: 4, freezer_friendly: true}
    meal_prep_score: 95
    ingredients:
      - {food: chicken-breast-raw, amount: 600}
      - {food: rapeseed-oil, amount: 1, unit: tbsp}
      - {food: onion, amount: 1, unit: piece}
      - {food: garlic, amount: 3, unit: clove}
      - {food: ginger-root, amount: 2, unit: tsp}
      - {food: turmeric, amount: 1, unit: tsp}
      - {food: cumin, amount: 1, unit: tsp}
      - {food: tomatoes-canned, amount: 1, unit: can}
      - {food: coconut-milk-canned, amount: 200, unit: ml}
      - {food: spinach, amount: 3, unit: handful}
      - {food: rice-brown-dry, amount: 240}
      - {food: salt, amount: 3, unit: pinch}
    steps:
      en:
        - Cook the rice. Fry the chopped onion in the oil for 5 minutes, add the garlic, ginger and spices for 1 minute.
        - Add the chicken cut into cubes and brown it for 4 minutes.
        - Pour in the tomatoes and coconut milk and simmer for 15 minutes.
        - Stir in the spinach, season and serve with the rice.
      pl:
        - Ugotuj ryż. Podsmaż posiekaną cebulę na oleju 5 minut, dodaj czosnek, imbir i przyprawy na minutę.
        - Dodaj kurczaka pokrojonego w kostkę i obsmaż 4 minuty.
        - Wlej pomidory i mleczko kokosowe i duś 15 minut.
        - Wmieszaj szpinak, dopraw i podawaj z ryżem.

  - slug: chicken-fajita-wraps
    title: {en: "Chicken fajita wraps", pl: "Tortille z kurczakiem fajita"}
    servings: 2
    prep_minutes: 10
    cook_minutes: 12
    difficulty: easy
    tags: [lunch, dinner, high_protein]
    equipment: [pan]
    storage: {fridge_days: 1}
    meal_prep_score: 40
    ingredients:
      - {food: chicken-breast-raw, amount: 280}
      - {food: bell-pepper-red, amount: 1, unit: piece}
      - {food: onion, amount: 1, unit: piece}
      - {food: olive-oil, amount: 1, unit: tbsp}
      - {food: paprika-sweet, amount: 1, unit: tsp}
      - {food: cumin, amount: 0.5, unit: tsp}
      - {food: garlic-powder, amount: 0.5, unit: tsp}
      - {food: tortilla-wheat, amount: 2, unit: piece}
      - {food: greek-yogurt-nonfat, amount: 80}
      - {food: romaine-lettuce, amount: 2, unit: handful}
      - {food: lemon-juice, amount: 1, unit: tsp}
    steps:
      en:
        - Slice the chicken, pepper and onion into strips and toss with the spices.
        - Fry in the oil over high heat for 8–10 minutes until the chicken is cooked.
        - Warm the tortillas, spread with yogurt mixed with lemon juice, add lettuce and the filling, and roll up.
      pl:
        - Pokrój kurczaka, paprykę i cebulę w paski i wymieszaj z przyprawami.
        - Smaż na oliwie na dużym ogniu 8–10 minut, aż kurczak się upiecze.
        - Podgrzej tortille, posmaruj jogurtem z sokiem z cytryny, dodaj sałatę i farsz, zwiń.

