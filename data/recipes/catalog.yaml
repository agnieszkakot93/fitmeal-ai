      - {food: walnuts, amount: 20}
      - {food: olive-oil, amount: 1, unit: tbsp}
      - {food: vinegar-balsamic, amount: 1, unit: tbsp}
      - {food: honey, amount: 1, unit: tsp}
      - {food: salt, amount: 1, unit: pinch}
    steps:
      en:
        - Simmer the lentils for 20–25 minutes until just tender and drain. Use pre-cooked beetroot or boil them for 30 minutes.
        - Whisk the oil, vinegar, honey and salt and toss with the warm lentils.
        - Add the diced beetroot and arugula and top with the crumbled feta and walnuts.
      pl:
        - Gotuj soczewicę 20–25 minut, aż będzie miękka, i odcedź. Użyj ugotowanych buraków albo gotuj je 30 minut.
        - Wymieszaj oliwę, ocet, miód i sól i połącz z ciepłą soczewicą.
        - Dodaj pokrojone buraki i rukolę, posyp pokruszoną fetą i orzechami.

  - slug: tuna-egg-salad-bowl
    title: {en: "Tuna, egg and green bean salad", pl: "Sałatka z tuńczykiem, jajkiem i fasolką"}
    servings: 2
    prep_minutes: 10
    cook_minutes: 10
    difficulty: easy
    tags: [lunch, high_protein]
    equipment: [pot]
    storage: {fridge_days: 2}
    meal_prep_score: 60
    ingredients:
      - {food: tuna-canned-water, amount: 2, unit: can}
      - {food: egg-whole-raw, amount: 2, unit: piece}
      - {food: green-beans, amount: 200}
      - {food: potatoes, amount: 250}
      - {food: cherry-tomatoes, amount: 8, unit: piece}
      - {food: olives-black, amount: 6, unit: piece}
      - {food: olive-oil, amount: 1, unit: tbsp}
      - {food: vinegar-spirit, amount: 1, unit: tsp}
      - {food: mustard, amount: 1, unit: tsp}
    steps:
      en:
        - Boil the diced potatoes for 10 minutes, adding the green beans for the last 4. Hard-boil the eggs.
        - Whisk the oil, vinegar and mustard.
        - Toss the potatoes, beans, tomatoes and olives with the dressing and top with the tuna and quartered eggs.
      pl:
        - Gotuj pokrojone ziemniaki 10 minut, na ostatnie 4 dodaj fasolkę. Ugotuj jajka na twardo.
        - Wymieszaj oliwę, ocet i musztardę.
        - Połącz ziemniaki, fasolkę, pomidorki i oliwki z sosem i ułóż na wierzchu tuńczyka i ćwiartki jajek.

  - slug: polish-vegetable-salad-light
    title: {en: "Light Polish vegetable salad", pl: "Lekka sałatka jarzynowa"}
    servings: 6
    prep_minutes: 25
    cook_minutes: 30
    difficulty: easy
    tags: [side, vegetarian, meal_prep, polish]
    equipment: [pot]
    storage: {fridge_days: 3}
    meal_prep_score: 75
    ingredients:
      - {food: potatoes, amount: 400}
      - {food: carrot, amount: 3, unit: piece}
      - {food: celeriac, amount: 150}
      - {food: egg-whole-raw, amount: 4, unit: piece}
      - {food: pickled-cucumbers, amount: 3, unit: piece}
      - {food: peas-frozen, amount: 150}
      - {food: onion, amount: 0.5, unit: piece}
      - {food: greek-yogurt-nonfat, amount: 150}
      - {food: mayonnaise, amount: 2, unit: tbsp}
      - {food: mustard, amount: 1, unit: tsp}
      - {food: salt, amount: 3, unit: pinch}
      - {food: black-pepper, amount: 2, unit: pinch}
    steps:
      en:
        - Boil the potatoes, carrots and celeriac in their skins until tender, about 25 minutes; cool and peel.
        - Hard-boil the eggs and cook the peas for 3 minutes.
        - Dice everything small, including the pickles and onion.
        - Mix the yogurt, mayonnaise and mustard, fold through and season.
      pl:
        - Ugotuj ziemniaki, marchew i seler w skórkach do miękkości, około 25 minut; ostudź i obierz.
        - Ugotuj jajka na twardo, a groszek przez 3 minuty.
        - Pokrój wszystko w drobną kostkę, łącznie z ogórkami i cebulą.
        - Wymieszaj jogurt, majonez i musztardę, połącz z warzywami i dopraw.

  - slug: mozzarella-tomato-salad
    title: {en: "Tomato and mozzarella salad", pl: "Sałatka caprese"}
