      pl:
        - Rozgrzej piekarnik do 200°C. Pokrój ziemniaki, marchew, cukinię i cebulę w kawałki.
        - Wymieszaj warzywa i kurczaka z oliwą, zgniecionym czosnkiem, majerankiem, papryką i solą.
        - Rozłóż na blasze i piecz 35–40 minut, raz przewracając, aż kurczak będzie złoty i upieczony.

  - slug: chicken-pesto-pasta
    title: {en: "Chicken pasta with spinach and parmesan", pl: "Makaron z kurczakiem, szpinakiem i parmezanem"}
    servings: 2
    prep_minutes: 10
    cook_minutes: 15
    difficulty: easy
