      - {food: vinegar-balsamic, amount: 1, unit: tsp}
      - {food: salt, amount: 1, unit: pinch}
      - {food: black-pepper, amount: 1, unit: pinch}
    steps:
      en:
        - Slice the tomatoes and mozzarella and arrange them alternately on a plate.
        - Scatter with basil, drizzle with the oil and vinegar and season.
      pl:
        - Pokrój pomidory i mozzarellę w plastry i ułóż je na zmianę na talerzu.
        - Posyp bazylią, skrop oliwą i octem i dopraw.

