      pl:
        - Ugotuj kaszę. Podsmaż cebulę i posiekane pieczarki na oleju 8 minut.
        - Dodaj poszatkowaną kapustę, przyprawy i wodę, przykryj i duś 20 minut.
        - Wmieszaj kaszę i passatę i gotuj jeszcze 10 minut. Jeśli chcesz, podawaj z łyżką kwaśnej śmietany.

  - slug: tempeh-sweet-potato-tray
    title: {en: "Tempeh, sweet potato and kale traybake", pl: "Tempeh pieczony z batatem i jarmużem"}
    servings: 2
    prep_minutes: 10
    cook_minutes: 30
    difficulty: easy
    tags: [dinner, vegan, high_protein, meal_prep]
    equipment: [oven, baking_tray]
