        - Cook the pasta and serve with the sauce.
      pl:
        - Duś posiekaną cebulę, marchew, pieczarki i czosnek na oliwie 8 minut.
        - Dodaj przepłukaną soczewicę, passatę, koncentrat, oregano i wodę i gotuj 25–30 minut, aż soczewica zmięknie.
        - Ugotuj makaron i podawaj z sosem.

  - slug: greek-quinoa-bowl
    title: {en: "Greek quinoa bowl with feta", pl: "Miska po grecku z komosą i fetą"}
    servings: 2
    prep_minutes: 10
    cook_minutes: 15
    difficulty: easy
    tags: [lunch, vegetarian, meal_prep]
    equipment: [pot]
    storage: {fridge_days: 3}
    meal_prep_score: 85
    ingredients:
      - {food: quinoa-dry, amount: 120}
      - {food: chickpeas-canned-drained, amount: 200}
      - {food: cucumber, amount: 0.5, unit: piece}
      - {food: cherry-tomatoes, amount: 10, unit: piece}
      - {food: olives-black, amount: 8, unit: piece}
      - {food: feta, amount: 80}
      - {food: olive-oil, amount: 1, unit: tbsp}
      - {food: lemon-juice, amount: 1, unit: tbsp}
      - {food: oregano, amount: 0.5, unit: tsp}
    steps:
      en:
        - Rinse the quinoa and cook it in twice its volume of water for 12–15 minutes; let it cool.
        - Dice the cucumber and halve the tomatoes and olives.
        - Whisk the oil, lemon juice and oregano, toss everything together and crumble the feta on top.
      pl:
        - Przepłucz komosę i gotuj w dwukrotnej ilości wody 12–15 minut; ostudź.
        - Pokrój ogórka w kostkę, przekrój pomidorki i oliwki.
        - Wymieszaj oliwę, sok z cytryny i oregano, połącz wszystko i pokrusz na wierzchu fetę.

  - slug: stuffed-peppers-rice-beans
    title: {en: "Stuffed peppers with rice and beans", pl: "Papryki faszerowane ryżem i fasolą"}
    servings: 4
    prep_minutes: 20
    cook_minutes: 35
    difficulty: medium
    tags: [dinner, vegetarian, meal_prep]
    equipment: [oven, pot]
    storage: {fridge_days: 3, freezer_friendly: true}
    meal_prep_score: 85
    ingredients:
      - {food: bell-pepper-red, amount: 4, unit: piece}
      - {food: rice-brown-dry, amount: 120}
      - {food: kidney-beans-canned-drained, amount: 1, unit: can}
      - {food: sweet-corn-canned-drained, amount: 100}
      - {food: onion, amount: 1, unit: piece}
      - {food: tomato-passata, amount: 250}
      - {food: cumin, amount: 1, unit: tsp}
      - {food: paprika-sweet, amount: 1, unit: tsp}
