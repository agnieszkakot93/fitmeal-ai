  - slug: protein-energy-balls
    title: {en: "Oat and date energy balls", pl: "Kulki mocy z owsem i daktylami"}
    servings: 6
    prep_minutes: 15
    cook_minutes: 0
    difficulty: easy
    tags: [snack, vegetarian, meal_prep]
    equipment: [food_processor]
    storage: {fridge_days: 7, freezer_friendly: true}
    meal_prep_score: 100
    ingredients:
      - {food: dates-dried, amount: 12, unit: piece}
      - {food: oats-rolled, amount: 60}
      - {food: whey-protein-isolate, amount: 1, unit: scoop}
      - {food: peanut-butter, amount: 2, unit: tbsp}
      - {food: cocoa-powder, amount: 1, unit: tbsp}
      - {food: water, amount: 2, unit: tbsp}
    steps:
      en:
        - Soak the pitted dates in hot water for 5 minutes and drain.
        - Blitz everything in a food processor until it holds together, adding water a spoon at a time.
        - Roll into 12 balls and chill for 30 minutes.
      pl:
        - Namocz daktyle bez pestek w gorącej wodzie przez 5 minut i odcedź.
        - Zmiksuj wszystko w malakserze, aż masa się połączy, dodając wodę po łyżce.
        - Uformuj 12 kulek i schłodź 30 minut.

  - slug: apple-cinnamon-baked
    title: {en: "Baked apples with cinnamon and walnuts", pl: "Pieczone jabłka z cynamonem i orzechami"}
    servings: 2
    prep_minutes: 5
    cook_minutes: 25
    difficulty: easy
    tags: [dessert, snack, vegetarian, polish]
    equipment: [oven]
    storage: {fridge_days: 2}
    meal_prep_score: 50
    ingredients:
      - {food: apple, amount: 2, unit: piece}
      - {food: walnuts, amount: 20}
      - {food: raisins, amount: 1, unit: tbsp}
      - {food: honey, amount: 2, unit: tsp}
      - {food: cinnamon, amount: 1, unit: tsp}
      - {food: greek-yogurt-nonfat, amount: 100}
    steps:
      en:
        - Heat the oven to 180°C and core the apples.
        - Mix the chopped walnuts, raisins, honey and cinnamon and stuff the apples.
        - Bake for 25 minutes and serve with the yogurt.
      pl:
        - Rozgrzej piekarnik do 180°C i wydrąż gniazda nasienne z jabłek.
        - Wymieszaj posiekane orzechy, rodzynki, miód i cynamon i nadziej jabłka.
        - Piecz 25 minut i podawaj z jogurtem.

  - slug: chocolate-protein-pudding
    title: {en: "Chocolate protein pudding", pl: "Budyń czekoladowy proteinowy"}
    servings: 2
    prep_minutes: 3
    cook_minutes: 7
    difficulty: easy
    tags: [dessert, snack, high_protein, vegetarian, quick]
    equipment: [pot]
    storage: {fridge_days: 3}
    meal_prep_score: 80
    ingredients:
      - {food: milk-skim, amount: 400, unit: ml}
      - {food: cornstarch, amount: 3, unit: tbsp}
      - {food: cocoa-powder, amount: 2, unit: tbsp}
      - {food: whey-protein-isolate, amount: 1, unit: scoop}
      - {food: honey, amount: 2, unit: tsp}
      - {food: raspberries, amount: 1, unit: handful}
    steps:
      en:
        - Whisk the cornstarch and cocoa into 100 ml of the cold milk. Bring the rest of the milk to a simmer.
        - Pour in the cocoa mixture, whisking, and cook for 1–2 minutes until thick.
        - Off the heat, whisk in the protein powder and honey. Serve warm or chilled with raspberries.
      pl:
        - Rozmieszaj skrobię i kakao w 100 ml zimnego mleka. Resztę mleka zagotuj.
        - Wlej mieszankę kakaową, mieszając trzepaczką, i gotuj 1–2 minuty, aż zgęstnieje.
        - Poza ogniem wmieszaj odżywkę i miód. Podawaj na ciepło lub schłodzony z malinami.

