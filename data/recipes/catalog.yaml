        - Fry the onion in the coconut oil for 5 minutes, add the garlic, ginger and spices for 1 minute.
        - Add the rinsed lentils, tomatoes and water and simmer for 20 minutes, stirring now and then.
        - Stir in the spinach and lemon juice, season, and serve with the cooked rice.
      pl:
        - Podsmaż cebulę na oleju kokosowym 5 minut, dodaj czosnek, imbir i przyprawy na minutę.
        - Dodaj przepłukaną soczewicę, pomidory i wodę i gotuj 20 minut, od czasu do czasu mieszając.
        - Wmieszaj szpinak i sok z cytryny, dopraw i podawaj z ugotowanym ryżem.

  - slug: chickpea-spinach-curry
    title: {en: "Chickpea and spinach curry", pl: "Curry z ciecierzycą i szpinakiem"}
    servings: 3
    prep_minutes: 10
    cook_minutes: 20
    difficulty: easy
    tags: [lunch, dinner, vegan, meal_prep]
    equipment: [pot]
    storage: {fridge_days: 4, freezer_friendly: true}
    meal_prep_score: 95
    ingredients:
      - {food: chickpeas-canned-drained, amount: 2, unit: can}
      - {food: onion, amount: 1, unit: piece}
      - {food: garlic, amount: 2, unit: clove}
      - {food: ginger-root, amount: 1, unit: tsp}
      - {food: rapeseed-oil, amount: 1, unit: tbsp}
      - {food: turmeric, amount: 1, unit: tsp}
      - {food: cumin, amount: 1, unit: tsp}
      - {food: tomato-passata, amount: 300}
      - {food: coconut-milk-canned, amount: 150, unit: ml}
      - {food: spinach, amount: 4, unit: handful}
      - {food: couscous-dry, amount: 180}
      - {food: salt, amount: 3, unit: pinch}
    steps:
      en:
        - Fry the onion, garlic and ginger in the oil for 5 minutes and add the spices.
        - Add the chickpeas, passata and coconut milk and simmer for 12 minutes.
        - Stir in the spinach. Pour boiling water over the couscous, cover for 5 minutes and fluff with a fork.
      pl:
        - Podsmaż cebulę, czosnek i imbir na oleju 5 minut i dodaj przyprawy.
        - Dodaj ciecierzycę, passatę i mleczko kokosowe i gotuj 12 minut.
        - Wmieszaj szpinak. Kuskus zalej wrzątkiem, przykryj na 5 minut i rozdziel widelcem.

  - slug: tofu-teriyaki-rice
    title: {en: "Teriyaki-style tofu with rice and greens", pl: "Tofu w stylu teriyaki z ryżem i warzywami"}
    servings: 2
    prep_minutes: 10
    cook_minutes: 20
    difficulty: easy
    tags: [dinner, vegan, high_protein]
    equipment: [pot, pan]
    storage: {fridge_days: 3}
    meal_prep_score: 70
    ingredients:
      - {food: tofu-firm, amount: 360}
      - {food: cornstarch, amount: 1, unit: tbsp}
      - {food: rapeseed-oil, amount: 1, unit: tbsp}
      - {food: soy-sauce, amount: 3, unit: tbsp}
      - {food: maple-syrup, amount: 1, unit: tbsp}
      - {food: ginger-root, amount: 1, unit: tsp}
      - {food: garlic, amount: 1, unit: clove}
      - {food: rice-white-dry, amount: 140}
      - {food: edamame-frozen, amount: 120}
      - {food: broccoli, amount: 200}
      - {food: sesame-seeds, amount: 1, unit: tsp}
    steps:
      en:
        - Cook the rice. Steam the broccoli and edamame for 5 minutes.
        - Pat the tofu dry, cube it, toss with the cornstarch and fry in the oil until golden on all sides.
        - Mix the soy sauce, maple syrup, ginger and garlic, pour over the tofu and let it bubble for 1 minute.
        - Serve with the rice and vegetables and sprinkle with sesame.
      pl:
        - Ugotuj ryż. Brokuły i edamame gotuj na parze 5 minut.
        - Osusz tofu, pokrój w kostkę, obtocz w skrobi i smaż na oleju, aż będzie złote ze wszystkich stron.
        - Wymieszaj sos sojowy, syrop klonowy, imbir i czosnek, wlej do tofu i gotuj minutę.
        - Podawaj z ryżem i warzywami, posyp sezamem.

  - slug: vegetable-lentil-bolognese
    title: {en: "Green lentil bolognese", pl: "Bolognese z zielonej soczewicy"}
    servings: 4
