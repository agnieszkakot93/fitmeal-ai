        - Add the spinach, the pasta and a splash of the water and toss until glossy.
        - Serve with the parmesan and pepper.
      pl:
        - Ugotuj makaron, odlej szklankę wody z gotowania.
        - Smaż kurczaka pokrojonego w kostkę na oliwie 6 minut, dodaj czosnek i przekrojone pomidorki na 2 minuty.
        - Dodaj szpinak, makaron i trochę wody z gotowania i mieszaj, aż sos się połączy.
        - Podawaj z parmezanem i pieprzem.

  - slug: turkey-stir-fry-vegetables
    title: {en: "Turkey and vegetable stir-fry", pl: "Indyk smażony z warzywami"}
