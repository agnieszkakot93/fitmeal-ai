      - {food: salt, amount: 1, unit: tsp}
    steps:
      en:
        - Rinse the peas and simmer them in the water for 30 minutes.
        - Add the diced potatoes, carrot and celeriac and simmer for 25 minutes more.
        - Fry the onion and garlic in the oil, stir in with the marjoram and salt and cook for 5 minutes.
      pl:
        - Przepłucz groch i gotuj go w wodzie 30 minut.
        - Dodaj pokrojone w kostkę ziemniaki, marchew i seler i gotuj jeszcze 25 minut.
        - Podsmaż cebulę z czosnkiem na oleju, dodaj do zupy z majerankiem i solą i gotuj 5 minut.

  - slug: pumpkin-ginger-soup
    title: {en: "Pumpkin and ginger soup", pl: "Krem z dyni z imbirem"}
    servings: 4
    prep_minutes: 15
    cook_minutes: 25
    difficulty: easy
    tags: [starter, soup, vegan, meal_prep]
    equipment: [pot, blender]
    storage: {fridge_days: 4, freezer_friendly: true}
    meal_prep_score: 90
    ingredients:
