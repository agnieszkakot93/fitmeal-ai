      - {food: salt, amount: 1, unit: tsp}
    steps:
      en:
        - Soften the onion and ginger in the oil, add the cubed pumpkin, carrots and water and simmer for 20 minutes.
        - Blend until smooth, stir in the coconut milk and season.
        - Toast the pumpkin seeds in a dry pan and scatter over each bowl.
      pl:
        - Zeszklij cebulę i imbir na oliwie, dodaj pokrojoną dynię, marchew i wodę i gotuj 20 minut.
        - Zmiksuj na gładko, wmieszaj mleczko kokosowe i dopraw.
        - Upraż pestki dyni na suchej patelni i posyp nimi zupę.

  - slug: cold-beet-soup-chlodnik
    title: {en: "Cold beet soup", pl: "Chłodnik litewski"}
    servings: 4
    prep_minutes: 20
    cook_minutes: 30
    difficulty: easy
    tags: [lunch, soup, vegetarian, polish]
    equipment: [pot]
    storage: {fridge_days: 2}
    meal_prep_score: 60
    ingredients:
      - {food: beetroot, amount: 3, unit: piece}
      - {food: buttermilk, amount: 1000, unit: ml}
      - {food: cucumber, amount: 1, unit: piece}
      - {food: radish, amount: 1, unit: bunch}
      - {food: dill, amount: 3, unit: tbsp}
      - {food: chives, amount: 2, unit: tbsp}
      - {food: egg-whole-raw, amount: 4, unit: piece}
      - {food: lemon-juice, amount: 2, unit: tbsp}
      - {food: salt, amount: 1, unit: tsp}
    steps:
      en:
        - Boil the beetroots until tender (about 30 minutes), cool, peel and grate.
        - Hard-boil the eggs for 9 minutes. Dice the cucumber and radishes and chop the herbs.
        - Mix the beetroot, vegetables and herbs into the buttermilk, season with lemon juice and salt and chill.
        - Serve with the halved eggs.
      pl:
        - Ugotuj buraki do miękkości (około 30 minut), ostudź, obierz i zetrzyj.
        - Ugotuj jajka na twardo (9 minut). Pokrój ogórka i rzodkiewki w kostkę, posiekaj zioła.
        - Wymieszaj buraki, warzywa i zioła z maślanką, dopraw sokiem z cytryny i solą i schłodź.
        - Podawaj z połówkami jajek.

  - slug: cauliflower-soup
    title: {en: "Cauliflower soup", pl: "Zupa kalafiorowa"}
