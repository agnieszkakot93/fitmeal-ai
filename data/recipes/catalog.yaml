    cook_minutes: 35
    difficulty: easy
    tags: [lunch, dinner, vegan, meal_prep]
    equipment: [pot]
    storage: {fridge_days: 4, freezer_friendly: true}
    meal_prep_score: 95
    ingredients:
      - {food: lentils-green-dry, amount: 200}
      - {food: onion, amount: 1, unit: piece}
      - {food: carrot, amount: 2, unit: piece}
