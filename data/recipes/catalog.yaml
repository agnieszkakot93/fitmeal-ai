      pl:
        - Rozgrzej piekarnik do 200°C. Pokrój batata i tempeh w kostkę i wymieszaj z oliwą, sosem sojowym i papryką.
        - Piecz 20 minut, dodaj jarmuż i piecz jeszcze 8 minut.
        - Wymieszaj tahini z sokiem z cytryny i odrobiną wody i polej danie.

  # ── Soups ─────────────────────────────────────────────────────────────────
  - slug: chicken-soup-rosol
    title: {en: "Chicken broth with noodles", pl: "Rosół z makaronem"}
    servings: 4
    prep_minutes: 15
    cook_minutes: 90
    difficulty: easy
    tags: [lunch, soup, high_protein, meal_prep, polish]
    equipment: [pot]
    storage: {fridge_days: 4, freezer_friendly: true}
    meal_prep_score: 90
    ingredients:
      - {food: chicken-drumstick-raw, amount: 6, unit: piece}
      - {food: chicken-breast-raw, amount: 200}
      - {food: carrot, amount: 3, unit: piece}
      - {food: celeriac, amount: 150}
      - {food: leek, amount: 0.5, unit: piece}
      - {food: onion, amount: 1, unit: piece}
      - {food: allspice, amount: 4, unit: piece}
      - {food: bay-leaf, amount: 2, unit: piece}
      - {food: water, amount: 2500, unit: ml}
      - {food: egg-noodles-dry, amount: 160}
      - {food: parsley, amount: 2, unit: tbsp}
      - {food: salt, amount: 1, unit: tsp}
    steps:
      en:
        - Put the chicken in a pot with the cold water, bring slowly to a simmer and skim.
        - Add the vegetables (char the onion halves in a dry pan first), allspice, bay leaves and salt.
        - Simmer gently, uncovered, for 1½ hours. Strain; slice the carrot and shred the breast meat back into the broth.
        - Cook the noodles separately and serve in the broth with parsley.
      pl:
        - Włóż kurczaka do garnka z zimną wodą, powoli doprowadź do wrzenia i zbierz szumowiny.
        - Dodaj warzywa (połówki cebuli najpierw opal na suchej patelni), ziele angielskie, liście laurowe i sól.
        - Gotuj na małym ogniu bez przykrycia 1,5 godziny. Przecedź; pokrój marchew i porwij mięso z piersi do bulionu.
        - Makaron ugotuj osobno i podawaj w rosole z natką.

  - slug: tomato-soup-rice
    title: {en: "Tomato soup with rice", pl: "Zupa pomidorowa z ryżem"}
    servings: 4
    prep_minutes: 10
    cook_minutes: 30
    difficulty: easy
    tags: [starter, soup, vegetarian, meal_prep, polish]
    equipment: [pot]
    storage: {fridge_days: 4, freezer_friendly: true}
    meal_prep_score: 90
    ingredients:
      - {food: tomato-passata, amount: 700}
      - {food: carrot, amount: 2, unit: piece}
      - {food: celeriac, amount: 100}
      - {food: onion, amount: 1, unit: piece}
      - {food: water, amount: 800, unit: ml}
      - {food: rice-white-dry, amount: 100}
