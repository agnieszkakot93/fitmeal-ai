        - Spread the rice cakes with the peanut butter.
        - Top with banana slices and a pinch of cinnamon.
      pl:
        - Posmaruj wafle masłem orzechowym.
        - Ułóż plasterki banana i oprósz cynamonem.

  - slug: yogurt-berry-ice-pops
    title: {en: "Yogurt berry ice pops", pl: "Lody jogurtowe z owocami"}
    servings: 6
    prep_minutes: 10
    cook_minutes: 0
    difficulty: easy
    tags: [dessert, snack, vegetarian, meal_prep]
    equipment: [blender, ice_pop_moulds]
    storage: {fridge_days: 0, freezer_friendly: true}
    meal_prep_score: 90
    ingredients:
      - {food: greek-yogurt-nonfat, amount: 400}
      - {food: strawberries, amount: 250}
      - {food: blueberries, amount: 100}
      - {food: honey, amount: 2, unit: tbsp}
    steps:
      en:
        - Blend the yogurt, strawberries and honey until smooth.
        - Drop a few blueberries into each mould and pour in the yogurt mixture.
        - Freeze for at least 5 hours.
      pl:
        - Zmiksuj jogurt, truskawki i miód na gładko.
        - Do każdej foremki wrzuć kilka borówek i wlej masę jogurtową.
        - Zamroź na co najmniej 5 godzin.

  - slug: roasted-chickpeas-paprika
    title: {en: "Crispy roasted chickpeas", pl: "Chrupiąca pieczona ciecierzyca"}
    servings: 3
    prep_minutes: 5
    cook_minutes: 30
    difficulty: easy
    tags: [snack, vegan, meal_prep]
    equipment: [oven, baking_tray]
    storage: {fridge_days: 0}
    meal_prep_score: 70
    ingredients:
      - {food: chickpeas-canned-drained, amount: 1, unit: can}
      - {food: olive-oil, amount: 2, unit: tsp}
      - {food: paprika-sweet, amount: 1, unit: tsp}
      - {food: garlic-powder, amount: 0.5, unit: tsp}
      - {food: salt, amount: 2, unit: pinch}
    steps:
      en:
        - Heat the oven to 200°C. Dry the chickpeas well with a towel.
        - Toss with the oil and spices and spread on a lined tray.
        - Roast for 25–30 minutes, shaking the tray halfway, until crisp. Store in an open container at room temperature.
      pl:
        - Rozgrzej piekarnik do 200°C. Dokładnie osusz ciecierzycę ręcznikiem.
        - Wymieszaj z oliwą i przyprawami i rozłóż na blasze wyłożonej papierem.
        - Piecz 25–30 minut, w połowie potrząsając blachą, aż będzie chrupiąca. Przechowuj w otwartym pojemniku w temperaturze pokojowej.

  - slug: banana-bread-oat
    title: {en: "Oat banana bread", pl: "Owsiany chlebek bananowy"}
    servings: 10
    prep_minutes: 10
    cook_minutes: 50
    difficulty: easy
    tags: [snack, dessert, vegetarian, meal_prep]
    equipment: [oven, loaf_tin, blender]
    storage: {fridge_days: 5, freezer_friendly: true}
    meal_prep_score: 90
    ingredients:
      - {food: banana, amount: 3, unit: piece}
      - {food: egg-whole-raw, amount: 2, unit: piece}
      - {food: oats-rolled, amount: 200}
      - {food: greek-yogurt-nonfat, amount: 150}
      - {food: honey, amount: 2, unit: tbsp}
      - {food: baking-powder, amount: 2, unit: tsp}
      - {food: cinnamon, amount: 1, unit: tsp}
      - {food: walnuts, amount: 40}
      - {food: dark-chocolate-70, amount: 4, unit: piece, optional: true}
    steps:
      en:
        - Heat the oven to 180°C and line a loaf tin.
        - Blend the oats into flour, then blend in the bananas, eggs, yogurt, honey, baking powder and cinnamon.
        - Fold in the chopped walnuts and chocolate if using, pour into the tin and bake for 45–50 minutes.
        - Cool in the tin for 10 minutes before slicing.
      pl:
        - Rozgrzej piekarnik do 180°C i wyłóż keksówkę papierem.
        - Zmiksuj płatki na mąkę, potem dodaj banany, jajka, jogurt, miód, proszek do pieczenia i cynamon i zmiksuj.
        - Wmieszaj posiekane orzechy i czekoladę, jeśli używasz, przelej do formy i piecz 45–50 minut.
        - Studź w formie 10 minut przed krojeniem.
