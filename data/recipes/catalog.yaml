    steps:
      en:
        - Cook the rice. Heat the oven to 190°C. Halve the peppers lengthways and remove the seeds.
        - Fry the onion in the oil, add the spices, beans, corn, half the passata and the rice and season.
        - Fill the peppers, pour the rest of the passata around them and top with the grated mozzarella.
        - Bake for 30–35 minutes until the peppers are soft.
      pl:
        - Ugotuj ryż. Rozgrzej piekarnik do 190°C. Przekrój papryki wzdłuż i usuń gniazda nasienne.
        - Podsmaż cebulę na oliwie, dodaj przyprawy, fasolę, kukurydzę, połowę passaty i ryż, dopraw.
        - Napełnij papryki, resztę passaty wlej dookoła i posyp startą mozzarellą.
        - Piecz 30–35 minut, aż papryki zmiękną.

  - slug: lazy-cabbage-rolls-buckwheat
    title: {en: "Lazy cabbage rolls with buckwheat and mushrooms", pl: "Leniwe gołąbki z kaszą i grzybami"}
    servings: 4
    prep_minutes: 15
    cook_minutes: 40
    difficulty: medium
    tags: [dinner, vegetarian, meal_prep, polish]
    equipment: [pot]
    storage: {fridge_days: 4, freezer_friendly: true}
    meal_prep_score: 90
    ingredients:
