      - {food: butter, amount: 1, unit: tbsp}
      - {food: cream-light-12, amount: 100, unit: ml}
      - {food: dill, amount: 2, unit: tbsp}
      - {food: salt, amount: 1, unit: tsp}
    steps:
      en:
        - Soften the sliced leek in the butter, add the water, diced potatoes and carrots and simmer for 10 minutes.
        - Add the cauliflower florets and simmer for 12 minutes more.
        - Stir in the tempered cream, season and sprinkle with dill.
      pl:
        - Zeszklij pokrojonego pora na maśle, wlej wodę, dodaj pokrojone ziemniaki i marchew i gotuj 10 minut.
        - Dodaj różyczki kalafiora i gotuj jeszcze 12 minut.
        - Wmieszaj zahartowaną śmietankę, dopraw i posyp koperkiem.

