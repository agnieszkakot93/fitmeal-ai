    prep_minutes: 15
    cook_minutes: 25
    difficulty: medium
    tags: [lunch, dinner, high_protein, meal_prep]
    equipment: [pan, pot]
    storage: {fridge_days: 4, freezer_friendly: true}
    meal_prep_score: 95
    ingredients:
