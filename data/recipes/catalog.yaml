      - {food: dill, amount: 2, unit: tbsp}
      - {food: salt, amount: 1, unit: tsp}
    steps:
      en:
        - Simmer the carrot, celeriac and onion with the allspice and bay leaf in the water for 20 minutes.
        - Remove the whole spices, add the passata and simmer for 5 minutes. Cook the rice separately.
        - Temper the cream with a ladle of soup, stir it in and season. Serve over the rice with dill.
      pl:
        - Gotuj marchew, seler i cebulę z zielem angielskim i liściem laurowym w wodzie 20 minut.
        - Wyjmij przyprawy, dodaj passatę i gotuj 5 minut. Ryż ugotuj osobno.
        - Zahartuj śmietankę chochlą zupy, wlej do garnka i dopraw. Podawaj z ryżem i koperkiem.

  - slug: pea-soup-split
    title: {en: "Split pea soup", pl: "Grochówka"}
    servings: 4
    prep_minutes: 10
    cook_minutes: 60
    difficulty: easy
    tags: [lunch, soup, vegan, meal_prep, polish]
    equipment: [pot]
