        - Return the turkey, add the soy sauce and noodles and toss for 1 minute.
      pl:
        - Ugotuj makaron. Pokrój indyka w cienkie paski i obtocz w skrobi.
        - Smaż indyka na mocno rozgrzanym oleju 3 minuty i odłóż.
        - Smaż warzywa z imbirem i czosnkiem 4 minuty.
        - Dodaj z powrotem indyka, sos sojowy i makaron i mieszaj minutę.

  # ── Lunch & dinner: fish ──────────────────────────────────────────────────
  - slug: salmon-potatoes-asparagus
