      - {food: salt, amount: 3, unit: pinch}
    steps:
      en:
        - Mix the turkey, egg, breadcrumbs, 1 grated garlic clove, oregano and salt; shape about 20 meatballs.
        - Fry the chopped onion and the other garlic clove in the oil, add the passata and bring to a simmer.
        - Add the meatballs and simmer, covered, for 18–20 minutes.
        - Cook the pasta and serve with the meatballs and torn basil.
      pl:
        - Wymieszaj indyka, jajko, bułkę tartą, 1 starty ząbek czosnku, oregano i sól; uformuj około 20 klopsików.
        - Podsmaż posiekaną cebulę i drugi ząbek czosnku na oliwie, wlej passatę i zagotuj.
        - Włóż klopsiki i duś pod przykryciem 18–20 minut.
        - Ugotuj makaron i podawaj z klopsikami i porwaną bazylią.

  - slug: chicken-thigh-traybake
    title: {en: "Chicken thigh and vegetable traybake", pl: "Udka z kurczaka pieczone z warzywami"}
    servings: 3
    prep_minutes: 10
    cook_minutes: 40
    difficulty: easy
    tags: [dinner, high_protein, meal_prep]
    equipment: [oven, baking_tray]
    storage: {fridge_days: 3}
