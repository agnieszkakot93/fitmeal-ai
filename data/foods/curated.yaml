# FitMeal AI — curated ingredient list
#
# This file owns everything *about* an ingredient: names, aliases, category,
# allergens (EU 14) and `may_contain` traces, culinary roles, portion weights,
# densities and package sizes. Nutrition values are NOT typed here: they come from
#   * `fdc`       → a USDA FoodData Central record (public domain), or
#   * `nutrition` → a product label (per 100 g, EU style: carbs exclude fiber).
# Entries with neither are "pending": kept for their names/aliases, skipped by
# the importer until a nutrition source is added.
#
# Provenance, per entry (see data/README.md):
#   * `traces: {status: unknown | none_declared | declared, source: {type: label | policy, ref: ...}}`
#     says whether `may_contain` is known. `unknown` is never "none": an ALLERGY
#     exclusion treats it as "may contain anything". Generic foods get traces
#     only from an approved rule of docs/data/TRACE_POLICY.md.
#   * `review: {status: draft | auto_checked | verified, by: <initials>, date: YYYY-MM-DD}`.
#     Only a named human sets `verified`, after checking the whole entry,
#     including portion weights, densities and package sizes (typical values).
# The FDC descriptions follow SR Legacy naming; `fitmeal-admin foods import
# --dry-run` lists any that do not match together with the closest FDC
# descriptions.
#
# Portion units: piece, clove, slice, scoop, handful, can, bunch, stalk, pack,
# pinch, plus volume overrides (tsp, tbsp, cup, szklanka) where weighing beats
# density (flour, rice, oats ...). Package sizes are in grams.

